  // 타임라인 (WBS 행 × 날짜 열, 간트 형태)
  function renderTimeline(){
    var d0 = parseYmd(cursor);
    var start = ymd(new Date(d0.getFullYear(), d0.getMonth(), 1));
    var n = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate();
    var end = addDays(start, n - 1);
    var DW = 32, LW = isMobile() ? 170 : 260;
    var today = todayStr(), q = query();
    var key = start;
    var old = calBody.querySelector('.tl');
    if(old && tlScroll.key === key){ tlScroll.top = old.scrollTop; tlScroll.left = old.scrollLeft; }
    else if(old){ tlScroll = {}; }

    var wrap = h('div', { class:'tl' });
    var inner = h('div', { class:'tl-inner', style:'width:' + (LW + n*DW) + 'px' });
    var head = h('div', { class:'tl-head' }, [ h('div', { class:'tl-lab', text:'WBS' }) ]);
    for(var i = 0; i < n; i++){
      var ds = addDays(start, i), dd = parseYmd(ds), wd = dd.getDay();
      head.appendChild(h('div', { class:'tl-day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + (ds === today ? ' today' : ''),
        style:'cursor:pointer', title:fmtLong(ds), onclick:(function(ds){ return function(){ openDay(ds); }; })(ds) },
        [ WD[wd], h('b', { text:dd.getDate() }) ]));
    }
    inner.appendChild(head);
    var body = h('div', { class:'tl-body' });
    var bg = h('div', { class:'tl-bg', style:'width:' + (n*DW) + 'px' });
    for(i = 0; i < n; i++){
      var wdd = parseYmd(addDays(start, i)).getDay();
      if(wdd === 0 || wdd === 6) bg.appendChild(h('div', { class:'tl-wk', style:'left:' + (i*DW) + 'px' }));
    }
    if(today >= start && today <= end) bg.appendChild(h('div', { class:'tl-now', style:'left:' + (diffDays(start, today)*DW + DW/2 - 1) + 'px' }));
    body.appendChild(bg);

    var vis = null;
    if(q){
      vis = {};
      var markUp = function(id){ var cur = TREE.byId[id], g = 0; while(cur && g++ < 200){ vis[cur.id] = 1; cur = cur.parentId ? TREE.byId[cur.parentId] : null; } };
      tasks.forEach(function(t){ if(taskMatch(t, q)) markUp(t.id); });
    }
    var skip = null, count = 0;
    TREE.rows.forEach(function(row){
      var t = row.task;
      if(q){ if(!vis[t.id]) return; }
      else { if(skip !== null && row.level > skip) return; skip = null; if(collapsed[t.id]) skip = row.level; }
      count++;
      var kids = children(t.id);
      var color = taskColor(t);
      var r = ownRange(t), rr = kids.length ? rollRange(t) : null;
      var trk = h('div', { class:'tl-track', style:'width:' + (n*DW) + 'px' });
      function clip(a){ var s = a.s < start ? start : a.s, e = a.e > end ? end : a.e; return (s > end || e < start) ? null : { l:diffDays(start, s)*DW, w:(diffDays(s, e) + 1)*DW }; }
      if(rr && (!r || rr.s !== r.s || rr.e !== r.e)){
        var cs = clip(rr);
        if(cs) trk.appendChild(h('div', { class:'tl-sum', title:'하위 작업 기간 ' + fmtRange(rr), style:'left:' + (cs.l+3) + 'px; width:' + (cs.w-6) + 'px' }));
      }
      if(r){
        var cb = clip(r);
        if(cb){
          var bar = h('div', { class:'tl-bar' + (t.marker === 'check' ? ' done' : '') + (sel && sel.id === t.id ? ' sel' : ''), draggable:'true',
            style:'left:' + (cb.l+2) + 'px; width:' + (cb.w-4) + 'px; background:' + color + '; color:' + textOn(color),
            title:(t.title || '제목 없음') + ' · ' + fmtRange(r),
            onclick:function(e){ e.stopPropagation(); selectTask(t.id); } },
            [ statusBox(t.id, t.marker || 'dot'), h('span', { class:'tt', text:(t.title && t.title.trim()) || '제목 없음' }) ]);
          bar.addEventListener('dragstart', function(e){
            var br = trk.getBoundingClientRect();
            dragInfo = { kind:'task', id:t.id, grab:addDays(start, Math.floor((e.clientX - br.left) / DW)) };
            try{ e.dataTransfer.setData('text/plain', t.id); }catch(_){}
          });
          trk.appendChild(bar);
        }
      }
      notesOf(t.id).forEach(function(nn){
        var nd = noteDate(nn);
        if(nd && nd >= start && nd <= end) trk.appendChild(h('div', { class:'tl-memo', title:'📝 ' + noteTitle(nn) + ' · ' + fmtMD(nd),
          style:'left:' + (diffDays(start, nd)*DW + DW/2) + 'px', onclick:function(e){ e.stopPropagation(); selectNote(nn.id); } }));
      });
      trk.addEventListener('dragover', function(e){ if(!dragInfo) return; e.preventDefault(); clearDropMarks(); trk.classList.add('drop'); });
      trk.addEventListener('dragleave', function(){ trk.classList.remove('drop'); });
      trk.addEventListener('drop', function(e){
        e.preventDefault(); clearDropMarks();
        var br = trk.getBoundingClientRect();
        dropOn(addDays(start, Math.max(0, Math.min(n-1, Math.floor((e.clientX - br.left) / DW)))));
      });
      trk.addEventListener('click', function(){ selectTask(t.id); });
      var lab = h('div', { class:'tl-lab', style:'padding-left:' + (8 + row.level*14) + 'px', onclick:function(){ selectTask(t.id); } }, [
        kids.length ? h('button', { class:'caret', text: collapsed[t.id] ? '▸' : '▾',
          onclick:function(e){ e.stopPropagation(); if(collapsed[t.id]) delete collapsed[t.id]; else collapsed[t.id] = 1; saveCollapsed(); renderTree(); renderCal(); } }) : h('span', { class:'caret-sp' }),
        h('span', { class:'stripe', style:'background:' + color }),
        markerBtn(t),
        h('span', { class:'tnum', text:row.num }),
        h('span', { class:'ttitle', style: row.level === 0 ? 'font-weight:650' : '', text:(t.title && t.title.trim()) || '제목 없음' })
      ]);
      body.appendChild(h('div', { class:'tl-row' + (sel && sel.id === t.id ? ' active' : '') + (t.marker === 'check' ? ' done' : '') }, [ lab, trk ]));
    });
    if(!count) body.appendChild(h('div', { class:'tl-empty', text:'표시할 작업이 없어요.' }));
    inner.appendChild(body);
    wrap.appendChild(inner);
    calBody.innerHTML = '';
    calBody.appendChild(wrap);
    if(tlScroll.key === key && tlScroll.left != null){ wrap.scrollTop = tlScroll.top; wrap.scrollLeft = tlScroll.left; }
    else if(today >= start && today <= end){ wrap.scrollLeft = Math.max(0, (diffDays(start, today) - 3) * DW); }
    tlScroll = { key:key, top:wrap.scrollTop, left:wrap.scrollLeft };
    wrap.addEventListener('scroll', function(){ tlScroll.top = wrap.scrollTop; tlScroll.left = wrap.scrollLeft; });
  }

  function openQuickAdd(date, anchor){

  /* =========================================================
     애플 메모 스타일 스마트 편집기
     - "1. " 입력 후 Enter → 2. 3. 자동 번호 (중간 삽입 시 자동 재번호)
     - "- " / "• " 글머리, "[] " → ☐ 체크리스트
     - 빈 항목에서 Enter → 목록 끝내기, Tab / Shift+Tab → 들여쓰기(하위 번호 1부터)
     - ☐ 클릭 또는 Ctrl/⌘+Enter → ☑ 체크 토글
     ========================================================= */
  var RE_NUM = /^([ \t]*)(\d+)([.)])[ \t]/, RE_BUL = /^([ \t]*)([-•*–])[ \t]/, RE_CHK = /^([ \t]*)([☐☑])[ \t]/;
  function lineInfo(line){
    var m;
    if((m = RE_NUM.exec(line))) return { type:'num', indent:m[1], n:+m[2], sep:m[3], plen:m[0].length };
    if((m = RE_CHK.exec(line))) return { type:'chk', indent:m[1], glyph:m[2], plen:m[0].length };
    if((m = RE_BUL.exec(line))) return { type:'bul', indent:m[1], glyph:m[2], plen:m[0].length };
    return { type:'none', indent:(/^[ \t]*/.exec(line) || [''])[0], plen:0 };
  }
  function replaceRange(ta, start, end, text){
    ta.focus();
    ta.setSelectionRange(start, end);
    var ok = false;
    try{ ok = text === '' ? document.execCommand('delete', false) : document.execCommand('insertText', false, text); }catch(e){ ok = false; }
    if(!ok || ta.value.slice(start, start + text.length) !== text){
      ta.setRangeText(text, start, end, 'end');
      ta.dispatchEvent(new Event('input', { bubbles:true }));
    }
  }
  function lineBounds(v, a, b){
    var ls = v.lastIndexOf('\n', a - 1) + 1;
    var le = v.indexOf('\n', b); if(le < 0) le = v.length;
    return { ls:ls, le:le };
  }
  function renumber(ta){
    var v = ta.value, lines = v.split('\n');
    var counters = {}, out = [], changed = false;
    var s0 = ta.selectionStart, s1 = ta.selectionEnd, ns0 = s0, ns1 = s1, off = 0;
    lines.forEach(function(line){
      var info = lineInfo(line), nl = line;
      if(info.type === 'none'){ counters = {}; }
      else {
        var ind = info.indent.replace(/\t/g, '    ').length;
        Object.keys(counters).forEach(function(k){ if(+k > ind) delete counters[k]; });
        if(info.type === 'num'){
          counters[ind] = counters[ind] == null ? info.n : counters[ind] + 1;
          if(counters[ind] !== info.n){
            nl = info.indent + counters[ind] + line.slice(info.indent.length + String(info.n).length);
            var delta = nl.length - line.length, numEnd = off + info.indent.length + String(info.n).length;
            if(numEnd <= s0) ns0 += delta;
            if(numEnd <= s1) ns1 += delta;
            changed = true;
          }
        } else { delete counters[ind]; }
      }
      out.push(nl);
      off += line.length + 1;
    });
    if(changed){
      ta.value = out.join('\n');
      ta.setSelectionRange(ns0, ns1);
      ta.dispatchEvent(new Event('input', { bubbles:true }));
    }
  }
  function toggleCheckAt(ta, pos){
    var v = ta.value, b = lineBounds(v, pos, pos), line = v.slice(b.ls, b.le), info = lineInfo(line);
    var keep = ta.selectionStart;
    if(info.type === 'chk'){
      var gi = b.ls + info.indent.length;
      replaceRange(ta, gi, gi + 1, info.glyph === '☐' ? '☑' : '☐');
      ta.setSelectionRange(keep, keep);
    } else {
      var start = b.ls + info.indent.length;
      replaceRange(ta, start, b.ls + info.plen, '☐ ');
      var d = 2 - (info.plen - info.indent.length);
      ta.setSelectionRange(keep + d, keep + d);
    }
  }
  function toggleList(ta, type){
    var v = ta.value, a = ta.selectionStart, bnd = lineBounds(v, a, ta.selectionEnd);
    var lines = v.slice(bnd.ls, bnd.le).split('\n');
    var nonEmpty = lines.filter(function(l){ return l.trim(); });
    var all = nonEmpty.length && nonEmpty.every(function(l){ return lineInfo(l).type === type; });
    var k = 1;
    var out = lines.map(function(l){
      var info = lineInfo(l);
      var rest = l.slice(info.type === 'none' ? info.indent.length : info.plen);
      if(all) return info.indent + rest;
      if(!l.trim() && lines.length > 1) return l;
      var p = type === 'num' ? (k++) + '. ' : type === 'bul' ? '• ' : '☐ ';
      return info.indent + p + rest;
    });
    var text = out.join('\n');
    replaceRange(ta, bnd.ls, bnd.le, text);
    if(lines.length === 1) ta.setSelectionRange(bnd.ls + text.length, bnd.ls + text.length);
    else ta.setSelectionRange(bnd.ls, bnd.ls + text.length);

  function shiftLines(ta, dir){
    var v = ta.value, a = ta.selectionStart, e = ta.selectionEnd, bnd = lineBounds(v, a, e);
    var lines = v.slice(bnd.ls, bnd.le).split('\n');
    var single = lines.length === 1;
    if(dir > 0 && single && a === e && lineInfo(lines[0]).type === 'none'){
      replaceRange(ta, a, e, '\t'); return;
    }
    var firstDelta = 0;
    var out = lines.map(function(l, i){
      var nl;
      if(dir > 0){
        var info = lineInfo(l);
        nl = '\t' + (info.type === 'num' ? l.replace(RE_NUM, function(m0, ind, n, sep){ return ind + '1' + sep + ' '; }) : l);
      } else {
        nl = l.replace(/^(\t| {1,4})/, '');
      }
      if(i === 0) firstDelta = nl.length - l.length;
      return nl;
    });
    var text = out.join('\n');
    replaceRange(ta, bnd.ls, bnd.le, text);
    if(single){ var p = Math.max(bnd.ls, a + firstDelta); ta.setSelectionRange(p, p); }
    else ta.setSelectionRange(bnd.ls, bnd.ls + text.length);
    renumber(ta);
  }
  function attachSmart(ta){
    ta.addEventListener('keydown', function(e){
      if(e.isComposing || e.keyCode === 229) return;
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); toggleCheckAt(ta, ta.selectionStart); return; }
      if(e.key === 'Enter' && !e.shiftKey && !e.altKey){
        var v = ta.value, pos = ta.selectionStart, end = ta.selectionEnd;
        var b = lineBounds(v, pos, pos), line = v.slice(b.ls, b.le), info = lineInfo(line);
        if(info.type === 'none' || pos < b.ls + info.plen) return;
        e.preventDefault();
        var content = line.slice(info.plen);
        if(!content.trim() && pos === end){
          if(info.indent.length){
            var cut = info.indent[0] === '\t' ? 1 : Math.min(4, info.indent.length);
            replaceRange(ta, b.ls, b.ls + cut, '');
            renumber(ta);
          } else {
            replaceRange(ta, b.ls, b.le, '');
          }
          return;
        }
        var next = info.indent + (info.type === 'num' ? (info.n + 1) + info.sep + ' ' : info.type === 'chk' ? '☐ ' : info.glyph + ' ');
        replaceRange(ta, pos, end, '\n' + next);
        renumber(ta);
        return;
      }
      if(e.key === 'Tab'){ e.preventDefault(); shiftLines(ta, e.shiftKey ? -1 : 1); }
    });
    ta.addEventListener('input', function(e){
      if(e.inputType !== 'insertText' || e.data !== ' ') return;
      var v = ta.value, pos = ta.selectionStart, ls = v.lastIndexOf('\n', pos - 1) + 1;
      var before = v.slice(ls, pos), m;
      if((m = /^([ \t]*)(\[\]|\[ \]) $/.exec(before))) replaceRange(ta, ls + m[1].length, pos, '☐ ');
      else if((m = /^([ \t]*)\* $/.exec(before))) replaceRange(ta, ls + m[1].length, pos, '• ');
      else if(/^[ \t]*\d+[.)] $/.test(before)) renumber(ta);
    });
    ta.addEventListener('click', function(){
      if(ta.selectionStart !== ta.selectionEnd) return;
      var v = ta.value, pos = ta.selectionStart, b = lineBounds(v, pos, pos), info = lineInfo(v.slice(b.ls, b.le));

      var gi = b.ls + info.indent.length;
      if(pos === gi || pos === gi + 1){ toggleCheckAt(ta, pos); ta.setSelectionRange(b.le, b.le); }
    });
    ta.addEventListener('blur', function(){ renumber(ta); });
    return ta;
  }

    ta.addEventListener('paste', pasteFiles('note', n.id));
    title.addEventListener('paste', pasteFiles('note', n.id));
    body.appendChild(attSection('note', n.id, body));
    refs.fillers = [];
    detailEl.appendChild(body);
  }

  function tasksOnDay(d){
    return TREE.rows.filter(function(r){ var x = ownRange(r.task); return x && x.s <= d && x.e >= d; }).map(function(r){ return r.task; });
  }
  function notesOnDay(d){ return notes.filter(function(n){ return noteDate(n) === d; }); }
  function overdueOn(d){
    return TREE.rows.filter(function(r){ var x = ownRange(r.task); return x && x.e < d && r.task.marker !== 'check'; }).map(function(r){ return r.task; });
  }
  function dayTaskRow(t, d){
    var r = ownRange(t), anc = ancestors(t);
    return h('div', { class:'lrow' + (t.marker === 'check' ? ' done' : ''), onclick:function(){ selectTask(t.id); } }, [
      markerBtn(t),
      h('span', { class:'stripe', style:'background:' + taskColor(t) }),
      h('span', { class:'tnum', text:TREE.num[t.id] }),
      h('span', { class:'lt' }, [ (t.title && t.title.trim()) || '제목 없음',
        anc.length ? h('small', { text:anc.map(function(a){ return (a.title && a.title.trim()) || '제목 없음'; }).join(' › ') }) : null ]),
      h('span', { class:'ld', text: r && (r.s !== r.e || r.e !== d) ? fmtRange(r) : '' })
    ]);
  }

  function buildDayDetail(d){
    var today = todayStr();
    detailEl.appendChild(h('div', { class:'d-toolbar' }, [
      tbBtn('‹', '전날', function(){ openDay(addDays(d, -1)); }),
      tbBtn('›', '다음날', function(){ openDay(addDays(d, 1)); }),
      tbBtn('오늘', '오늘로', function(){ openDay(today); }),
      h('span', { class:'grow' }),
      tbBtn('✕', '닫기', closeDetail)
    ]));
    var body = h('div', { class:'d-body' });
    refs.body = body;
    body.appendChild(h('div', { class:'day-title' }, [ fmtLong(d), d === today ? h('span', { class:'tag', text:'오늘' }) : null ]));

    var input = h('input', { type:'text', placeholder:'이 날에 추가할 제목 입력 후 Enter', autocomplete:'off' });
    var pSel = h('select', { title:'상위 작업' }, taskOptions(null, '최상위 작업 (새 프로젝트)', ''));
    function add(kind){
      var v = input.value.trim();
      if(kind === 'task'){ if(!v){ input.focus(); return; } createTask({ title:v, date:d, parentId:pSel.value || null, select:false }); input.value = ''; input.focus(); renderDay(); }
      else createNote({ title:v, date:d, taskId:pSel.value || null });
    }
    input.addEventListener('keydown', function(e){ if(e.isComposing || e.keyCode === 229) return; if(e.key === 'Enter'){ e.preventDefault(); add('task'); } });
    body.appendChild(h('div', { class:'day-add' }, [ input, pSel, h('div', { class:'btns' }, [
      h('button', { class:'primary', text:'작업 추가', onclick:function(){ add('task'); } }),
      h('button', { text:'메모 추가', onclick:function(){ add('note'); } })
    ]) ]));

    var box = h('div');
    function renderDay(){
      box.innerHTML = '';
      var ts = tasksOnDay(d), ns = notesOnDay(d);
      box.appendChild(h('div', { class:'section' }, [
        h('div', { class:'sec-head' }, [ h('span', { class:'sec-title', text:'이 날의 작업 · ' + ts.length }) ]),
        ts.length ? ts.map(function(t){ return dayTaskRow(t, d); }) : h('div', { class:'muted', text:'일정이 없어요.' })
      ]));
      if(d === today){
        var od = overdueOn(d);
        if(od.length) box.appendChild(h('div', { class:'section' }, [
          h('div', { class:'sec-head' }, [ h('span', { class:'sec-title', style:'color:var(--danger)', text:'마감 지났는데 미완료 · ' + od.length }) ]),
          od.map(function(t){ return dayTaskRow(t, d); })
        ]));
      }
      box.appendChild(h('div', { class:'section' }, [
        h('div', { class:'sec-head' }, [ h('span', { class:'sec-title', text:'이 날의 메모 · ' + ns.length }) ]),
        ns.length ? ns.map(memoCard) : h('div', { class:'muted', text:'메모가 없어요.' })
      ]));
      box.appendChild(h('button', { class:'report-btn', text:'📋 이 날의 보고 내용 복사', onclick:function(){ copyText(dayReport(d)); } }));
    }
    renderDay();
    body.appendChild(box);
    refs.fillers = [renderDay];
    detailEl.appendChild(body);
  }

  function dayReport(d){
    var out = [fmtLong(d) + ' 업무 보고', ''];
    var ts = tasksOnDay(d);
    out.push('■ 작업 (' + ts.length + ')');
    if(!ts.length) out.push('  - 없음');
    ts.forEach(function(t){
      var r = ownRange(t), anc = ancestors(t);
      out.push('  ' + markerMeta(t.marker).glyph + ' ' + TREE.num[t.id] + ' ' + ((t.title && t.title.trim()) || '제목 없음') +
        (anc.length ? '  [' + ((anc[0].title && anc[0].title.trim()) || '') + ']' : '') + (r && r.s !== r.e ? '  (' + fmtRange(r) + ')' : ''));
    });
    if(d === todayStr()){
      var od = overdueOn(d);
      if(od.length){ out.push('', '■ 지연 (' + od.length + ')'); od.forEach(function(t){ out.push('  ' + markerMeta(t.marker).glyph + ' ' + TREE.num[t.id] + ' ' + (t.title || '제목 없음') + '  (마감 ' + fmtMD(ownRange(t).e) + ')'); }); }
    }
    var ns = notesOnDay(d);
    if(ns.length){
      out.push('', '■ 메모 (' + ns.length + ')');
      ns.forEach(function(n){
        var tid = noteTask(n);
        out.push('  📝 ' + noteTitle(n) + (tid ? '  [' + TREE.num[tid] + ' ' + (TREE.byId[tid].title || '') + ']' : ''));
        (n.body || '').split('\n').filter(function(l){ return l.trim(); }).slice(0, 12).forEach(function(l){ out.push('     ' + l); });
      });
    }
    return out.join('\n');
  }
  function copyText(text){
    function fallback(){
      var ta = h('textarea', { value:text, style:'position:fixed; left:-9999px' });
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast('복사했어요'); }catch(e){ toast('복사에 실패했어요'); }
      ta.remove();
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast('보고 내용을 복사했어요'); }, fallback);
    else fallback();
  }

  /* =========================================================
     구글 캘린더 / ICS
     ========================================================= */
  function gcalUrl(t){
    var r = t && ownRange(t); if(!r) return null;
    var text = encodeURIComponent(((TREE.num[t.id] ? '[' + TREE.num[t.id] + '] ' : '') + (t.title || '제목 없음')));
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + text +
      '&dates=' + r.s.replace(/-/g,'') + '/' + addDays(r.e, 1).replace(/-/g,'') + '&details=' + encodeURIComponent(t.notes || '');
  }
  function icsEsc(s){ return String(s || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
  function exportIcs(){
    var now = new Date();
    var stamp = now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + '00Z';
    var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Memo_Jim//WBS//KO','CALSCALE:GREGORIAN','X-WR-CALNAME:Memo_Jim WBS'];
    var cnt = 0;
    TREE.rows.forEach(function(row){
      var t = row.task, r = ownRange(t); if(!r) return;
      cnt++;
      L.push('BEGIN:VEVENT', 'UID:' + t.id + '@memo-jim', 'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + r.s.replace(/-/g,''), 'DTEND;VALUE=DATE:' + addDays(r.e, 1).replace(/-/g,''),
        'SUMMARY:' + icsEsc('[' + row.num + '] ' + (t.title || '제목 없음') + (t.marker === 'check' ? ' ✓' : '')),
        'DESCRIPTION:' + icsEsc(t.notes || ''), 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    if(!cnt){ toast('날짜가 있는 작업이 없어요'); return; }
    var blob = new Blob([L.join('\r\n')], { type:'text/calendar;charset=utf-8' });
    var a = h('a', { href:URL.createObjectURL(blob), download:'memo-jim-wbs-' + todayStr() + '.ics' });
    document.body.appendChild(a); a.click(); a.remove();
    toast(cnt + '개 작업을 .ics로 내보냈어요');
  }

  /* =========================================================
     이벤트 바인딩
     ========================================================= */
  var memoTreeChk = document.getElementById('memoTreeChk');
  var memoCalChk = document.getElementById('memoCalChk');
  memoTreeChk.checked = !!ui.memoTree;
  memoCalChk.checked = !!ui.memoCal;
  memoTreeChk.addEventListener('change', function(){ ui.memoTree = memoTreeChk.checked; saveUi(); renderTree(); });
  memoCalChk.addEventListener('change', function(){ ui.memoCal = memoCalChk.checked; saveUi(); renderCal(); });
  var persChk = document.getElementById('persChk');
  persChk.checked = !!ui.showPersonal;
  persChk.addEventListener('change', function(){ ui.showPersonal = persChk.checked; saveUi(); renderCal(); });
  document.getElementById('gcalBtn').addEventListener('click', function(){
    if(G.clientId && lsGet('mj.gwas', 0) && !gReady() && G.tc) gConnect(); else openGSettings();
  });
  setInterval(function(){ gSync(true); }, 5 * 60000);
  setInterval(gUpdateBtn, 60000);
  window.addEventListener('focus', function(){ gSync(false); });
  var bodyChk = document.getElementById('bodyChk');
  bodyChk.checked = !!ui.showBody;
  bodyChk.addEventListener('change', function(){ ui.showBody = bodyChk.checked; saveUi(); renderCal(); });
  var hideDoneChk = document.getElementById('hideDoneChk');
  hideDoneChk.checked = !!ui.hideDone;
  hideDoneChk.addEventListener('change', function(){ ui.hideDone = hideDoneChk.checked; saveUi(); renderCal(); });
  document.getElementById('newTaskBtn').addEventListener('click', function(){
    var parent = null;
    createTask({ parentId:parent });
  });
  document.getElementById('newNoteBtn').addEventListener('click', function(){
    var tid = sel && sel.type === 'task' ? sel.id : (sel && sel.type === 'note' ? (getNote(sel.id) || {}).taskId : null);
    createNote({ taskId:tid || null, date: sel && sel.type === 'day' ? sel.id : todayStr() });
  });
  document.getElementById('expandAllBtn').addEventListener('click', function(){ collapsed = {}; saveCollapsed(); renderTree(); if(ui.view === 'timeline') renderCal(); });
  document.getElementById('collapseAllBtn').addEventListener('click', function(){
    collapsed = {}; tasks.forEach(function(t){ if(children(t.id).length || notesOf(t.id).length) collapsed[t.id] = 1; });
    saveCollapsed(); renderTree(); if(ui.view === 'timeline') renderCal();
  });
  var searchTimer = null;
  searchInput.addEventListener('input', function(){ clearTimeout(searchTimer); searchTimer = setTimeout(function(){ renderTree(); renderCal(); }, 120); });
  document.getElementById('todayBtn').addEventListener('click', function(){ cursor = todayStr(); renderCal(); });
  document.getElementById('prevBtn').addEventListener('click', function(){ cursor = ui.view === 'week' ? addDays(cursor, -7) : ui.view === 'day' ? addDays(cursor, -1) : addMonths(cursor, -1); renderCal(); });
  document.getElementById('nextBtn').addEventListener('click', function(){ cursor = ui.view === 'week' ? addDays(cursor, 7) : ui.view === 'day' ? addDays(cursor, 1) : addMonths(cursor, 1); renderCal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeLB(); closeGSettings(); } });
  document.getElementById('viewSeg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-v]'); if(!b) return;
    ui.view = b.getAttribute('data-v'); saveUi(); renderCal();
  });
  document.getElementById('exportIcsBtn').addEventListener('click', exportIcs);

  var mobileNav = document.getElementById('mobileNav');
  function setMobile(m){
    mainEl.setAttribute('data-m', m);
    Array.prototype.forEach.call(mobileNav.querySelectorAll('button'), function(b){ b.classList.toggle('active', b.getAttribute('data-m') === m); });
    if(m === 'cal') requestAnimationFrame(renderCal);
  }
  mobileNav.addEventListener('click', function(e){ var b = e.target.closest('button[data-m]'); if(b) setMobile(b.getAttribute('data-m')); });
  setMobile('cal');

  document.addEventListener('click', function(e){
    closeMarkerMenu();
    if(qaEl && !qaEl.contains(e.target)) closeQA();
  });
  window.addEventListener('scroll', closeMarkerMenu, true);
  var rzT = null;
  window.addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(renderCal, 120); });
  // 상세 패널 열고 닫힐 때 캘린더 폭이 바뀌므로 다시 배치
  if(window.ResizeObserver){
    var lastW = 0, lastH = 0;
    new ResizeObserver(function(entries){
      var cr = entries[0].contentRect;
      if(Math.abs(cr.width - lastW) > 2 || Math.abs(cr.height - lastH) > 2){ lastW = cr.width; lastH = cr.height; clearTimeout(rzT); rzT = setTimeout(renderCal, 60); }
    }).observe(calBody);
  }

  window.addEventListener('keydown', function(e){
    var meta = e.metaKey || e.ctrlKey;
    if(meta && e.key.toLowerCase() === 'n'){ e.preventDefault(); createTask({}); return; }
    if(e.key === 'Escape'){
      if(openMenu){ closeMarkerMenu(); return; }
      if(qaEl){ closeQA(); return; }
      var ae = document.activeElement;
      if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)){ ae.blur(); return; }
      if(sel) closeDetail();
    }
  });

  /* =========================================================
     Firebase 연결 & 실시간 동기화
     ========================================================= */
  function starterNote(){
    var now = Date.now();
    return { title:'메모 사용법', taskId:null, date:todayStr(), createdAt:now, updatedAt:now,
      body:'애플 메모처럼 목록이 자동으로 이어져요.\n\n1. 번호를 쓰고 Enter를 누르면\n2. 다음 번호가 자동으로 붙어요\n3. 빈 줄에서 Enter를 한 번 더 누르면 목록이 끝나요\n\n• Tab으로 들여쓰기, Shift+Tab으로 내어쓰기\n☐ [] 를 입력하면 체크리스트가 돼요\n☑ ☐를 클릭하면 체크돼요\n\n메모는 작업에 소속시킬 수 있어요. 위쪽 ‘소속 작업’에서 골라보세요.' };
  }
  function starterTasks(){
    var now = Date.now(), t0 = todayStr();
    var top = uid(), s1 = uid(), s2 = uid(), s3 = uid();
    return [
      { id:top, parentId:null, title:'예시 프로젝트: 웹사이트 리뉴얼', notes:'이 작업은 예시예요. 자유롭게 지우거나 고쳐 쓰세요.', startDate:'', date:'', marker:'dot', createdAt:now, updatedAt:now },
      { id:s1, parentId:top, title:'요구사항 정리', notes:'', startDate:addDays(t0,-2), date:t0, marker:'check', createdAt:now+1, updatedAt:now+1 },
      { id:s2, parentId:top, title:'디자인 시안', notes:'', startDate:addDays(t0,1), date:addDays(t0,4), marker:'arrow-right', createdAt:now+2, updatedAt:now+2 },
      { id:s3, parentId:top, title:'개발', notes:'', startDate:addDays(t0,5), date:addDays(t0,12), marker:'question', createdAt:now+3, updatedAt:now+3 }
    ];
  }
  function configLooksReal(){ return typeof firebaseConfig !== 'undefined' && firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('여기에') === -1; }
  function offline(msg){
    document.getElementById('setupBanner').classList.add('show');
    setSync('off', msg);
    refresh(); renderDetail();
  }

  async function initApp(){
    gUpdateBtn();
    if(G.clientId) gLoadLib().catch(function(){});
    if(gReady()) setTimeout(function(){ gAfterConnect(); }, 0);
    refresh();
    if(!configLooksReal() || typeof firebase === 'undefined'){ offline('오프라인'); return; }
    setSync('', '연결 중…');
    try{
      firebase.initializeApp(firebaseConfig);
      await firebase.auth().signInAnonymously();
    }catch(e){
      var why = (e && e.code) || (e && e.message) || '';
      offline(location.protocol === 'file:' ? '파일로 열림 — 웹 주소로 열어주세요' : (/unauthorized-domain|operation-not-allowed/.test(why) ? 'Firebase 승인 도메인에 ' + location.hostname + ' 추가 필요' : '연결 실패 ' + why));
      return;
    }

    db = firebase.firestore();
    notesCol = db.collection('notes');
    tasksCol = db.collection('tasks');
    filesCol = db.collection('files');
    marksCol = db.collection('gmarks');
    settingsDoc = db.collection('settings').doc('gcal');
    chunksCol = db.collection('fileChunks');

    try{
      var n0 = await notesCol.get();
      if(n0.empty){ var sn = starterNote(); await notesCol.doc(uid()).set(sn); }
    }catch(e){}
    try{
      var t0 = await tasksCol.get();
      if(t0.empty){
        var st = starterTasks();
        for(var i = 0; i < st.length; i++){ await tasksCol.doc(st[i].id).set(taskDoc(st[i])); }
      }
    }catch(e){}

    setSync('on', '동기화됨');

    notesCol.onSnapshot(function(snap){
      notes = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      refresh(); softDetail();
      setSync('on', '동기화됨');
    }, function(){ setSync('off', '동기화 오류'); });

    tasksCol.onSnapshot(function(snap){
      tasks = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      refresh(); softDetail();
      setSync('on', '동기화됨');
    }, function(){ setSync('off', '동기화 오류'); });

    marksCol.onSnapshot(function(snap){
      snap.docs.forEach(function(d){ var v = d.data(); if(v && v.marker) G.marks[d.id] = v.marker; });
      lsSet('mj.gmarks', G.marks); renderCalOnly();
    }, function(){});
    settingsDoc.onSnapshot(function(d){
      var v = d.exists ? d.data() : null; if(!v) return;
      var changed = v.clientId && v.clientId !== G.clientId;
      if(v.clientId) G.clientId = v.clientId;
      if(v.cals && v.cals.length) G.cals = v.cals;
      if(v.writeCal) G.writeCal = v.writeCal;
      if(v.calColors) G.calColors = v.calColors;
      if(v.persColor) G.persColor = v.persColor;
      lsSet('mj.gcalcolors', G.calColors); lsSet('mj.perscolor', G.persColor);
      renderCalOnly();
      lsSet('mj.gcid', G.clientId); lsSet('mj.gcals', G.cals); lsSet('mj.gwrite', G.writeCal);
      if(changed) G.tc = null;
      if(G.clientId) gLoadLib().catch(function(){});
      gUpdateBtn();
    }, function(){});

    filesCol.onSnapshot(function(snap){
      files = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      afterFilesChange();
    }, function(){});
  }

  initApp();
})();
</script>
</body>
