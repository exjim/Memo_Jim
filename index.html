<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모 · 할일</title>

<!--
  ============================================================
  Memo_Jim v3 — WBS · 캘린더 · 메모 통합판
  ============================================================
  - 기존 Firebase(memo-jim) 데이터(notes, tasks 컬렉션)를 그대로 사용합니다.
    기존 작업/메모는 전부 그대로 보이고, 새 필드만 추가됩니다.
      tasks : startDate(시작일), color(색상), order(수동 순서)  ※ date = 마감일(기존 필드)
      notes : taskId(소속 작업), date(메모 날짜), createdAt
      files / fileChunks : 첨부 사진·파일 (새 컬렉션, 규칙은 기존 것 그대로 적용됨)
  - Firebase 설정/규칙은 이전 버전과 동일합니다 (변경 없음).

  [Firestore 규칙 — 이미 적용되어 있다면 그대로 두세요]
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /{document=**} {
           allow read, write: if request.auth != null;
         }
       }
     }
  ============================================================
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  :root{
    --bg:#f6f2ea; --bg-sidebar:#efe9dd; --surface:#fffdf8; --border:#e0d8c5; --line:#ebe4d4;
    --text:#2c2620; --text-muted:#8a8171; --accent:#b8792f; --accent-soft:#f0dfc0;
    --danger:#b3452f; --danger-soft:#f3ddd4; --ok:#4c8a5b; --ok-soft:#dcecdf; --sat:#3f6fb5;
    --weekend: rgba(138,129,113,.06);
    --shadow: 0 1px 2px rgba(44,38,32,.06), 0 6px 20px rgba(44,38,32,.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1812; --bg-sidebar:#221e16; --surface:#242019; --border:#3a352a; --line:#2f2a21;
      --text:#ece5d6; --text-muted:#9c9483; --accent:#e0a855; --accent-soft:#3d3018;
      --danger:#e2775a; --danger-soft:#3d2620; --ok:#8fc79c; --ok-soft:#213228; --sat:#8fb0e6;
      --weekend: rgba(0,0,0,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    }
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', system-ui, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; }
  input, select, textarea{ font:inherit; color:inherit; }

  .page{ display:flex; flex-direction:column; height:100vh; height:100dvh; min-height:520px; }

  /* ---------- top bar ---------- */
  .topbar{
    flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; height:50px;
    background:var(--bg-sidebar); border-bottom:1px solid var(--border);
  }
  .brand{ font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight:650; font-size:1.08rem; letter-spacing:-.01em; white-space:nowrap; }
  .brand small{ font-family:'Noto Sans KR', sans-serif; font-weight:600; font-size:.72rem; color:var(--text-muted); margin-left:6px; }
  .topbar .grow{ flex:1; }
  .ghost-btn{
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:5px 11px;
    font-size:.8rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .ghost-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .sync-pill{
    display:flex; align-items:center; gap:6px; font-size:.72rem; font-weight:600; color:var(--text-muted);
    border:1px solid var(--border); background:var(--surface); padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .sync-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-muted); }
  .sync-pill.on{ color:var(--ok); } .sync-pill.on .dot{ background:var(--ok); }
  .sync-pill.off{ color:var(--danger); } .sync-pill.off .dot{ background:var(--danger); }

  .setup-banner{ display:none; padding:9px 16px; background:var(--danger-soft); border-bottom:1px solid var(--border); font-size:.82rem; }
  .setup-banner.show{ display:block; }

  /* ---------- layout ---------- */
  .main{ flex:1; min-height:0; display:grid; grid-template-columns: 320px minmax(0,1fr); }
  .main.with-detail{ grid-template-columns: 320px minmax(0,1fr) 400px; }
  @media (max-width:1250px){
    .main{ grid-template-columns: 280px minmax(0,1fr); }
    .main.with-detail{ grid-template-columns: 280px minmax(0,1fr) 370px; }
  }

  /* ---------- WBS sidebar ---------- */
  .side{ background:var(--bg-sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; min-width:0; min-height:0; }
  .side-head{ padding:12px 12px 10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--border); }
  .search{ position:relative; }
  .search input{ width:100%; padding:7px 10px 7px 30px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:.86rem; }
  .search input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .search svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-muted); pointer-events:none; }
  .side-actions{ display:flex; gap:6px; }
  .new-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 8px;
    border-radius:8px; border:1px solid transparent; background:var(--accent); color:#fff9ef;
    font-weight:600; font-size:.84rem; cursor:pointer;
  }
  .new-btn.alt{ background:var(--surface); color:var(--text); border-color:var(--border); }
  .new-btn:hover{ filter:brightness(1.05); }
  .side-opts{ display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:.76rem; color:var(--text-muted); }
  .side-opts .links button{ border:none; background:none; color:var(--text-muted); font-size:.74rem; cursor:pointer; padding:2px 4px; border-radius:5px; }
  .side-opts .links button:hover{ color:var(--accent); background:var(--surface); }
  .switch{ display:inline-flex; align-items:center; gap:5px; cursor:pointer; user-select:none; font-size:.76rem; color:var(--text-muted); font-weight:600; white-space:nowrap; }
  .switch input{ accent-color: var(--accent); margin:0; }

  .tree{ list-style:none; margin:0; padding:6px 6px 24px; overflow-y:auto; flex:1; min-height:0; }
  .trow, .nrow{
    display:flex; align-items:center; gap:5px; padding:4px 8px; border-radius:7px; cursor:pointer;
    min-height:32px; border:1px solid transparent; position:relative;
  }
  .trow:hover, .nrow:hover{ background:var(--surface); }
  .trow.active, .nrow.active{ background:var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .caret{ width:16px; height:18px; flex:none; border:none; background:none; color:var(--text-muted); cursor:pointer; font-size:.66rem; padding:0; border-radius:4px; }
  .caret:hover{ background:var(--bg); color:var(--text); }
  .caret-sp{ width:16px; flex:none; }
  .stripe{ width:3px; height:16px; border-radius:2px; flex:none; }
  .tnum{ font-size:.72rem; color:var(--text-muted); flex:none; font-weight:600; }
  .ttitle{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.88rem; font-weight:500; }
  .trow.lv0 .ttitle{ font-weight:650; }
  .trow.done .ttitle{ text-decoration:line-through; opacity:.55; }
  .tmeta{ flex:none; display:flex; align-items:center; gap:5px; font-size:.7rem; color:var(--text-muted); }
  .tmeta .late{ color:var(--danger); font-weight:700; }
  .tmeta .roll{ font-style:italic; opacity:.8; }
  .pill{ border:1px solid var(--border); border-radius:999px; padding:0 6px; line-height:16px; font-size:.66rem; font-weight:700; background:var(--surface); }
  .nrow{ min-height:28px; }
  .nrow .nicon{ flex:none; font-size:.78rem; width:16px; text-align:center; }
  .nrow .ttitle{ font-size:.82rem; color:var(--text); font-weight:450; }
  .group-label{
    display:flex; align-items:center; gap:6px; padding:14px 8px 4px; font-size:.72rem; font-weight:700;
    letter-spacing:.04em; color:var(--text-muted); cursor:pointer; user-select:none;
  }
  .empty-list{ padding:24px 14px; color:var(--text-muted); font-size:.84rem; text-align:center; line-height:1.55; }
  .trow.dragging, .ev.dragging{ opacity:.45; }

  .marker-btn{
    flex:none; width:20px; height:20px; border-radius:6px; border:1px solid var(--border);
    background:var(--surface); font-size:.78rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1; padding:0;
  }
  .marker-btn.m-check{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .marker-btn.m-question{ color:var(--danger); }
  .marker-btn.m-progress{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  .marker-btn:hover{ border-color:var(--accent); }
  .marker-menu{
    position:fixed; z-index:95; background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); padding:6px; display:flex; gap:4px;
  }
  .marker-menu button{ min-width:44px; height:44px; border-radius:7px; border:1px solid transparent; background:none; font-size:1rem; font-weight:700; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:2px 4px; line-height:1.1; }
  .marker-menu button small{ font-size:.6rem; font-weight:600; color:var(--text-muted); white-space:nowrap; }
  .marker-menu button:hover{ background:var(--accent-soft); }
  .marker-menu button.sel{ border-color:var(--accent); }

  /* ---------- calendar ---------- */
  .cal{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--surface); }
  .cal-head{ flex:none; display:flex; align-items:center; gap:6px; padding:9px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .cal-head h2{ font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight:700; font-size:1.25rem; margin:0 8px 0 4px; white-space:nowrap; }
  .today-btn{ border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:5px 14px; font-weight:600; font-size:.84rem; cursor:pointer; }
  .today-btn:hover{ background:var(--bg); }
  .nav-btn{ width:32px; height:32px; border-radius:50%; border:none; background:none; font-size:1.25rem; cursor:pointer; color:var(--text-muted); display:flex; align-items:center; justify-content:center; }
  .nav-btn:hover{ background:var(--bg); color:var(--text); }
  .cal-head .grow{ flex:1; }
  .seg{ display:flex; gap:2px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:2px; }
  .seg button{ border:none; background:none; cursor:pointer; font-size:.8rem; font-weight:600; color:var(--text-muted); padding:5px 11px; border-radius:6px; }
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .cal-body{ flex:1; min-height:0; position:relative; overflow:hidden; }

  .month{ display:flex; flex-direction:column; height:100%; }
  .dow{ display:grid; grid-template-columns:repeat(7,1fr); flex:none; border-bottom:1px solid var(--line); }
  .dow div{ text-align:center; font-size:.7rem; font-weight:700; color:var(--text-muted); padding:7px 0 5px; letter-spacing:.04em; }
  .dow .sun{ color:var(--danger); } .dow .sat{ color:var(--sat); }
  .weeks{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .week{ flex:1 1 0; position:relative; border-bottom:1px solid var(--line); min-height:70px; }
  .week:last-child{ border-bottom:none; }
  .cells{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(7,1fr); }
  .cell{ border-right:1px solid var(--line); padding-top:4px; text-align:center; cursor:pointer; min-width:0; }
  .cell:last-child{ border-right:none; }
  .cell.wkend{ background:var(--weekend); }
  .cell.drop{ background:var(--accent-soft); }
  .dnum{ display:inline-flex; min-width:24px; height:24px; padding:0 5px; align-items:center; justify-content:center; border-radius:12px; font-size:.76rem; font-weight:600; cursor:pointer; }
  .dnum:hover{ background:var(--bg); }
  .cell.other .dnum{ color:var(--text-muted); opacity:.55; }
  .cell.sun .dnum{ color:var(--danger); } .cell.sat .dnum{ color:var(--sat); }
  .cell.today .dnum{ background:var(--accent); color:#fff; opacity:1; }
  .cell.dsel .dnum{ box-shadow:0 0 0 2px var(--accent); }

  .ev{
    position:absolute; height:19px; line-height:19px; font-size:.72rem; font-weight:600; border-radius:5px;
    padding:0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; z-index:2;
  }
  .ev.cl{ border-top-left-radius:0; border-bottom-left-radius:0; }
  .ev.cr{ border-top-right-radius:0; border-bottom-right-radius:0; }
  .ev.done{ opacity:.5; }
  .ev.done .tt{ text-decoration:line-through; text-decoration-thickness:2px; }
  .ev.task{ padding-left:2px; }
  .ev .sb{
    display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; margin:2px 4px 0 0; vertical-align:top;
    border-radius:4px; border:1.5px solid currentColor; background:rgba(255,255,255,.28); font-size:.66rem; font-weight:800; line-height:1;
    cursor:pointer; padding:0; color:inherit; flex:none;
  }
  .ev .sb:hover{ background:rgba(255,255,255,.6); transform:scale(1.12); }
  .ev .sb.m-check{ background:#fff; color:var(--ok); border-color:#fff; }
  .ev .sb.m-progress{ background:#fff; color:#b8792f; border-color:#fff; }
  .ev .sb.m-question{ background:#fff; color:#b3452f; border-color:#fff; }
  .ev.m-progress{ box-shadow:inset 0 -3px 0 rgba(255,255,255,.55); }
  .ev.m-question{ box-shadow:inset 0 0 0 2px rgba(179,69,47,.85); }
  .tl-bar .sb{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; margin-right:4px; border-radius:4px;
    border:1.5px solid currentColor; background:rgba(255,255,255,.28); font-size:.66rem; font-weight:800; line-height:1; cursor:pointer; padding:0; color:inherit; vertical-align:-2px; }
  .tl-bar .sb.m-check{ background:#fff; color:var(--ok); border-color:#fff; }
  .tl-bar .sb.m-progress{ background:#fff; color:#b8792f; border-color:#fff; }
  .tl-bar.done .tt{ text-decoration:line-through; text-decoration-thickness:2px; }
  .legend{ display:flex; gap:8px; font-size:.72rem; color:var(--text-muted); white-space:nowrap; }
  .legend b{ font-weight:800; margin-right:2px; }
  .legend .l-ok b{ color:var(--ok); } .legend .l-pr b{ color:var(--accent); } .legend .l-q b{ color:var(--danger); }
  @media (max-width: 900px){ .legend{ display:none; } }
  .ev .g{ margin-right:4px; opacity:.9; }
  .ev .n{ font-size:.64rem; opacity:.8; margin-right:4px; }
  .ev.note{ background:transparent; color:var(--text); font-weight:500; }
  .ev.note:hover{ background:var(--bg); }
  .ev.note .nd{ display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px; vertical-align:1px; }
  .ev.task:hover{ filter:brightness(1.07); }
  .ev.sel{ outline:2px solid var(--text); outline-offset:1px; z-index:3; }
  .more{ position:absolute; height:19px; line-height:19px; font-size:.7rem; font-weight:700; color:var(--text-muted); padding:0 6px; cursor:pointer; z-index:2; border-radius:5px; white-space:nowrap; }
  .more:hover{ background:var(--bg); color:var(--text); }

  /* ----- 캘린더 내용 표시 (펼침) ----- */
  .weeks.xp{ overflow:auto; }
  .weeks.xp .week{ flex:none; }
  .ev.xp{ padding:0; white-space:normal; line-height:normal; background:var(--surface); color:var(--text);
    border:1px solid var(--evc); border-left:4px solid var(--evc); display:flex; flex-direction:column; }
  .ev.xp .evh{ flex:none; height:19px; line-height:19px; padding:0 6px 0 2px; background:var(--evc); color:var(--evt);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev.note.xp{ border-style:dashed; border-left-style:solid; }
  .ev.note.xp .evh{ background:transparent; color:var(--text); padding-left:5px; }
  .ev .at{ margin-left:5px; font-size:.64rem; opacity:.85; }
  .evb{ padding:2px 4px 3px; min-width:0; }
  .bl{ display:flex; align-items:center; gap:4px; height:17px; font-size:.7rem; font-weight:500; white-space:nowrap; overflow:hidden; color:var(--text); }
  .bl .cb{ flex:none; width:12px; height:12px; border:1.5px solid var(--text-muted); border-radius:3px; background:var(--surface);
    font-size:.58rem; font-weight:800; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; color:#fff; }
  .bl .cb.plain{ border-style:dashed; opacity:.75; }
  .bl .cb:hover{ border-color:var(--ok); opacity:1; }
  .bl .cb.on{ background:var(--ok); border-color:var(--ok); border-style:solid; opacity:1; }
  .bl .bt{ overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .bl.on .bt{ text-decoration:line-through; color:var(--text-muted); }
  .bl.more-l{ color:var(--text-muted); font-size:.64rem; padding-left:16px; }

  /* ----- 일 보기 ----- */
  .dayv{ height:100%; overflow:auto; padding:14px 20px 40px; }
  .dayv-top{ display:flex; align-items:center; gap:10px; font-size:.82rem; color:var(--text-muted); margin-bottom:4px; flex-wrap:wrap; }
  .dayv-top .grow{ flex:1; }
  .dayv h3{ font-size:.76rem; font-weight:700; color:var(--text-muted); letter-spacing:.04em; margin:18px 0 8px; }
  .dcard{ background:var(--surface); border:1px solid var(--border); border-left:5px solid var(--evc); border-radius:10px; padding:10px 12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .dcard.done{ opacity:.6; } .dcard.done .dtt{ text-decoration:line-through; text-decoration-thickness:2px; }
  .dcard.sel{ box-shadow:0 0 0 2px var(--accent); }
  .dcard.over{ background:var(--accent-soft); }
  .dch{ display:flex; align-items:center; gap:8px; cursor:pointer; min-width:0; }
  .dch .dt{ flex:1; min-width:0; }
  .dch .dtt{ font-weight:700; font-size:.95rem; }
  .dch .dt small{ display:block; font-weight:500; font-size:.72rem; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dch .dr{ font-size:.75rem; color:var(--text-muted); white-space:nowrap; }
  .dch .dat{ border:1px solid var(--border); background:none; border-radius:6px; font-size:.74rem; padding:3px 7px; cursor:pointer; color:var(--text-muted); }
  .dch .dat:hover{ border-color:var(--accent); color:var(--accent); }
  .dcb{ margin-top:8px; padding:0 0 0 2px; }
  .dcb .bl{ height:auto; min-height:24px; font-size:.87rem; white-space:normal; align-items:flex-start; padding:3px 0; gap:8px; }
  .dcb .bl .cb{ width:17px; height:17px; margin-top:1px; font-size:.74rem; border-radius:4px; }
  .dcb .bl .bt{ overflow:visible; white-space:pre-wrap; word-break:break-word; }
  .dempty{ font-size:.78rem; color:var(--text-muted); margin-top:6px; }

  /* ----- 첨부 ----- */
  .att-zone{ border:1.5px dashed var(--border); border-radius:10px; padding:10px; transition:background .15s; }
  .att-zone.over{ border-color:var(--accent); background:var(--accent-soft); }
  .att-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
  .att{ position:relative; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); cursor:pointer;
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; min-width:0; }
  .att:hover{ border-color:var(--accent); }
  .att img{ width:100%; height:100%; object-fit:cover; display:block; }
  .att .fi{ font-size:1.5rem; line-height:1; }
  .att .fn{ font-size:.64rem; padding:0 4px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .att .fs{ font-size:.58rem; color:var(--text-muted); }
  .att.up{ opacity:.6; cursor:default; }
  .att .x{ position:absolute; top:3px; right:3px; min-width:20px; height:20px; border-radius:10px; border:none; background:rgba(0,0,0,.55);
    color:#fff; font-size:.68rem; cursor:pointer; display:none; padding:0 5px; }
  .att:hover .x, .att .x.arm{ display:block; }
  .att .x.arm{ background:var(--danger); }
  @media (hover:none){ .att .x{ display:block; } }
  .att-hint{ font-size:.72rem; color:var(--text-muted); margin-top:8px; line-height:1.5; }
  .att-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .att-row .att{ width:64px; height:64px; }
  .lb{ position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .lb img{ max-width:100%; max-height:calc(100% - 64px); object-fit:contain; border-radius:6px; background:#fff; }
  .lb iframe{ width:min(960px, 100%); height:calc(100% - 64px); border:none; border-radius:6px; background:#fff; }
  .lb .lbfile{ color:#fff; text-align:center; font-size:.95rem; }
  .lb .lbfile .fi{ font-size:3.5rem; margin-bottom:8px; }
  .lb .lbbar{ display:flex; gap:8px; align-items:center; color:#fff; margin-top:12px; font-size:.84rem; flex-wrap:wrap; justify-content:center; }
  .lb .lbbar a, .lb .lbbar button{ color:#fff; background:rgba(255,255,255,.16); border:none; padding:6px 12px; border-radius:7px; cursor:pointer; text-decoration:none; font-size:.82rem; }
  .lb .lbbar a:hover, .lb .lbbar button:hover{ background:rgba(255,255,255,.28); }

  /* ----- 구글 캘린더 / 개인 일정 ----- */
  .gbtn-top{ display:inline-flex; align-items:center; gap:6px; }
  .gbtn-top .gd{ width:8px; height:8px; border-radius:50%; background:var(--text-muted); }
  .gbtn-top.on .gd{ background:#0b8043; }
  .gbtn-top.exp{ color:var(--danger); border-color:var(--danger); }
  .gbtn-top.exp .gd{ background:var(--danger); }
  .ev .tm{ font-size:.64rem; font-weight:800; margin-right:4px; opacity:.95; }
  .ev .gg{ font-size:.56rem; font-weight:800; padding:0 3px; border-radius:3px; background:rgba(255,255,255,.28); margin-left:4px; }
  .legend .l-pe b{ color:#0b8043; }
  .gmodal{ position:fixed; inset:0; z-index:110; background:rgba(0,0,0,.42); display:flex; align-items:center; justify-content:center; padding:16px; }
  .gpanel{ background:var(--surface); color:var(--text); border-radius:14px; box-shadow:var(--shadow); width:min(580px, 100%); max-height:calc(100vh - 32px); overflow:auto; padding:18px 20px 20px; }
  .gpanel h2{ margin:0; font-size:1.1rem; }
  .gpanel ol{ padding-left:20px; font-size:.82rem; line-height:1.75; margin:8px 0; }
  .gpanel a{ color:var(--accent); }
  .gpanel code{ background:var(--bg); padding:1px 5px; border-radius:4px; font-size:.78rem; word-break:break-all; }
  .gpanel .gi{ width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); font-size:.82rem; }
  .gpanel .gi2{ padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); font-size:.82rem; }
  .gpanel .grow2{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .gpanel .gbtn{ border:1px solid var(--border); background:var(--surface); padding:7px 14px; border-radius:8px; font-weight:600; font-size:.82rem; cursor:pointer; }
  .gpanel .gbtn:hover{ border-color:#0b8043; }
  .gpanel .gbtn.primary{ background:#0b8043; color:#fff; border-color:transparent; }
  .gpanel .gbtn:disabled{ opacity:.4; cursor:not-allowed; }
  .gpanel .gcal-list label{ display:flex; align-items:center; gap:8px; font-size:.84rem; padding:4px 0; }
  .gpanel .gcal-list .sw2{ width:10px; height:10px; border-radius:3px; background:#0b8043; flex:none; }
  .gpanel .gcolors{ display:flex; gap:5px; flex-wrap:wrap; margin:2px 0 8px 26px; }
  .gpanel .gc{ width:18px; height:18px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .gpanel .gc.sel{ border-color:var(--text); box-shadow:0 0 0 2px var(--surface) inset; }
  .gpanel .gsec{ margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
  .gpanel .gst{ font-size:.84rem; font-weight:700; margin:10px 0 4px; }
  .gtag{ display:inline-block; font-size:.72rem; font-weight:700; color:#fff; background:#0b8043; border-radius:6px; padding:3px 9px; }
  .pers-row{ display:flex; align-items:center; gap:8px; font-size:.84rem; cursor:pointer; }
  .pers-row input{ accent-color:#0b8043; width:16px; height:16px; }
  .qa .pers-row{ margin-top:8px; font-size:.8rem; }
  .qa .gline{ display:flex; gap:6px; margin-top:6px; }
  .qa .gline input{ flex:0 0 110px; border:1px solid var(--border); border-radius:7px; padding:5px 6px; background:var(--bg); }
  .qa .gline button{ flex:1; border:none; background:#0b8043; color:#fff; border-radius:7px; padding:6px 8px; font-size:.8rem; font-weight:700; cursor:pointer; }
  .gtime{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .gtime .field{ margin-bottom:0; }

  /* timeline */
  .tl{ height:100%; overflow:auto; position:relative; }
  .tl-inner{ position:relative; min-height:100%; }
  .tl-head{ position:sticky; top:0; z-index:5; display:flex; background:var(--surface); border-bottom:1px solid var(--border); }
  .tl-lab{
    position:sticky; left:0; z-index:4; width:260px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    padding:0 10px; display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap; cursor:pointer;
  }
  .tl-head .tl-lab{ z-index:6; font-size:.72rem; font-weight:700; color:var(--text-muted); cursor:default; }
  .tl-lab .ttitle{ font-size:.82rem; }
  .tl-day{ width:32px; flex:none; text-align:center; font-size:.62rem; padding:5px 0 4px; color:var(--text-muted); font-weight:600; }
  .tl-day b{ display:block; font-size:.76rem; color:var(--text); width:22px; height:22px; line-height:22px; margin:1px auto 0; border-radius:50%; }
  .tl-day.sun, .tl-day.sun b{ color:var(--danger); } .tl-day.sat, .tl-day.sat b{ color:var(--sat); }
  .tl-day.today b{ background:var(--accent); color:#fff; }
  .tl-body{ position:relative; }
  .tl-bg{ position:absolute; top:0; bottom:0; left:260px; pointer-events:none; }
  .tl-wk{ position:absolute; top:0; bottom:0; width:32px; background:var(--weekend); }
  .tl-now{ position:absolute; top:0; bottom:0; width:2px; background:var(--accent); opacity:.7; }
  .tl-row{ display:flex; height:32px; border-bottom:1px solid var(--line); }
  .tl-row:hover .tl-lab{ background:var(--bg); }
  .tl-row.active .tl-lab{ background:var(--accent-soft); }
  .tl-row.done .ttitle{ text-decoration:line-through; opacity:.55; }
  .tl-track{ position:relative; flex:none; }
  .tl-track.drop{ background:color-mix(in srgb, var(--accent-soft) 60%, transparent); }
  .tl-bar{ position:absolute; top:7px; height:18px; border-radius:5px; font-size:.68rem; line-height:18px; padding:0 6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer; font-weight:600; z-index:1; }
  .tl-bar.done{ opacity:.5; }
  .tl-bar.sel{ outline:2px solid var(--text); outline-offset:1px; }
  .tl-sum{ position:absolute; top:12px; height:7px; border-radius:2px; background:var(--text); opacity:.45; }
  .tl-memo{ position:absolute; top:25px; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:var(--accent); cursor:pointer; z-index:2; }
  .tl-empty{ padding:40px; text-align:center; color:var(--text-muted); font-size:.86rem; }

  /* ---------- detail pane ---------- */
  .detail{ display:none; flex-direction:column; min-width:0; min-height:0; background:var(--surface); border-left:1px solid var(--border); }
  .main.with-detail .detail{ display:flex; }
  .d-toolbar{ flex:none; display:flex; align-items:center; gap:2px; padding:7px 10px; border-bottom:1px solid var(--border); min-height:46px; }
  .d-toolbar .grow{ flex:1; }
  .tb-btn{
    border:1px solid transparent; background:none; color:var(--text-muted); height:30px; min-width:30px; border-radius:7px;
    font-size:.82rem; font-weight:600; cursor:pointer; padding:0 7px; display:inline-flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap;
  }
  .tb-btn:hover{ background:var(--bg); color:var(--text); }
  .tb-btn.danger:hover{ color:var(--danger); }
  .tb-btn.back{ color:var(--accent); max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .num-badge{ font-size:.74rem; font-weight:700; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:2px 7px; color:var(--text-muted); margin-right:4px; }
  .d-body{ flex:1; overflow-y:auto; padding:4px 22px 48px; }
  .confirm-bar{ display:none; align-items:center; gap:8px; padding:8px 14px; background:var(--danger-soft); border-bottom:1px solid var(--border); font-size:.82rem; }
  .confirm-bar.show{ display:flex; }
  .confirm-bar span{ flex:1; }
  .confirm-bar button{ font-size:.8rem; font-weight:600; border-radius:6px; padding:5px 10px; cursor:pointer; border:1px solid var(--border); background:transparent; }
  .confirm-bar .btn-danger{ background:var(--danger); color:#fff; border-color:transparent; }

  .breadcrumb{ font-size:.78rem; color:var(--text-muted); padding-top:12px; }
  .breadcrumb a{ color:var(--text-muted); cursor:pointer; text-decoration:none; }
  .breadcrumb a:hover{ color:var(--accent); text-decoration:underline; }
  .title-input{ border:none; background:transparent; font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight:700; font-size:1.45rem; padding:6px 0 2px; width:100%; }
  .title-input:focus{ outline:none; }
  .title-input::placeholder{ color:var(--text-muted); opacity:.6; }
  .stamp{ color:var(--text-muted); font-size:.74rem; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:0; transition:opacity .2s ease; }
  .save-dot.show{ opacity:1; }

  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .field > label, .sec-title{ font-size:.72rem; font-weight:700; color:var(--text-muted); letter-spacing:.03em; }
  .field select, .field input[type="date"], .qa select, .day-add select{
    border:1px solid var(--border); background:var(--bg); font-size:.86rem; padding:6px 8px; border-radius:7px; width:100%;
  }
  .row2{ display:flex; gap:10px; }
  .row2 > .field{ flex:1; min-width:0; }
  .hint{ font-size:.74rem; color:var(--text-muted); line-height:1.5; }
  .linkish{ border:none; background:none; color:var(--accent); font-size:.76rem; font-weight:600; cursor:pointer; padding:0; }
  .segmented{ display:flex; gap:5px; flex-wrap:wrap; }
  .segmented button{
    border:1px solid var(--border); background:var(--bg); color:var(--text-muted); font-size:.85rem; font-weight:700;
    width:36px; height:32px; border-radius:8px; cursor:pointer;
  }
  .segmented button.sel{ background:var(--accent-soft); color:var(--text); border-color:color-mix(in srgb, var(--accent) 40%, transparent); }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .sw{ width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; box-shadow:0 0 0 1px rgba(0,0,0,.08) inset; }
  .sw.sel{ border-color:var(--text); }
  .sw.auto{ background:var(--bg); font-size:.6rem; font-weight:700; color:var(--text-muted); border:1px dashed var(--border); }
  .sw.auto.sel{ border:2px solid var(--text); }
  .gcal-btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--bg); font-size:.82rem; font-weight:600; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .gcal-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .gcal-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .gcal-btn svg{ width:15px; height:15px; }

  .section{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .sec-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px; }
  .add-btn{ border:1px dashed var(--border); background:none; color:var(--text-muted); font-size:.78rem; font-weight:600; padding:4px 9px; border-radius:7px; cursor:pointer; white-space:nowrap; }
  .add-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .lrow{ display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:7px; cursor:pointer; }
  .lrow:hover{ background:var(--bg); }
  .lrow .lt{ flex:1; min-width:0; font-size:.86rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow .lt small{ display:block; color:var(--text-muted); font-size:.7rem; }
  .lrow .ld{ font-size:.72rem; color:var(--text-muted); flex:none; }
  .lrow.done .lt{ text-decoration:line-through; opacity:.55; }
  .memo-card{ padding:8px 10px; border:1px solid var(--border); border-radius:9px; margin-bottom:6px; cursor:pointer; background:var(--surface); }
  .memo-card:hover{ border-color:var(--accent); }
  .memo-card .mt{ font-weight:600; font-size:.86rem; display:flex; justify-content:space-between; gap:8px; }
  .memo-card .mt span:last-child{ font-weight:500; color:var(--text-muted); font-size:.72rem; flex:none; }
  .memo-card .ms{ font-size:.78rem; line-height:1.5; color:var(--text-muted); margin-top:3px; white-space:pre-line; max-height:4.5em; overflow:hidden; }
  .muted{ font-size:.8rem; color:var(--text-muted); padding:4px 2px; }

  .fmt-bar{ display:flex; gap:4px; margin:4px 0 6px; flex-wrap:wrap; }
  .fmt-bar button{ border:1px solid var(--border); background:var(--bg); height:28px; min-width:32px; padding:0 8px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.8rem; }
  .fmt-bar button:hover{ border-color:var(--accent); color:var(--accent); }
  .fmt-bar .sep{ width:1px; background:var(--border); margin:3px 2px; }
  .smart{
    border:1px solid transparent; border-radius:8px; background:transparent; font-size:.95rem; line-height:1.7;
    resize:vertical; width:100%; min-height:140px; padding:4px 2px; tab-size:4; -moz-tab-size:4;
  }
  .smart:focus{ outline:none; border-color:var(--border); background:color-mix(in srgb, var(--bg) 40%, transparent); }
  .smart.big{ min-height:52vh; }
  .smart::placeholder{ color:var(--text-muted); opacity:.65; }

  .day-title{ font-family:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight:700; font-size:1.35rem; padding:14px 0 4px; display:flex; align-items:center; gap:8px; }
  .tag{ font-family:'Noto Sans KR', sans-serif; font-size:.68rem; font-weight:700; background:var(--accent); color:#fff; padding:2px 7px; border-radius:999px; }
  .day-add{ display:flex; flex-direction:column; gap:6px; margin:10px 0 4px; }
  .day-add input{ border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:8px 10px; font-size:.88rem; width:100%; }
  .day-add input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .day-add .btns{ display:flex; gap:6px; }
  .day-add .btns button, .qa .btns button{ flex:1; border:1px solid var(--border); background:var(--surface); border-radius:7px; padding:6px 8px; font-size:.8rem; font-weight:600; cursor:pointer; }
  .day-add .btns button.primary, .qa .btns button.primary{ background:var(--accent); color:#fff9ef; border-color:transparent; }
  .report-btn{ margin-top:18px; width:100%; border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:8px; font-size:.84rem; font-weight:600; cursor:pointer; }
  .report-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .empty-detail{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-muted); text-align:center; padding:40px; font-size:.88rem; }

  /* quick add popover */
  .qa{ position:fixed; z-index:90; width:310px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:12px; display:flex; flex-direction:column; gap:8px; }
  .qa .qd{ font-size:.78rem; font-weight:700; color:var(--text-muted); display:flex; justify-content:space-between; }
  .qa input[type="text"]{ border:none; border-bottom:2px solid var(--accent); background:transparent; padding:6px 2px; font-size:1rem; width:100%; }
  .qa input[type="text"]:focus{ outline:none; }
  .qa .btns{ display:flex; gap:6px; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:.84rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:100; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .mobile-nav{ display:none; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background: color-mix(in srgb, var(--text-muted) 35%, transparent); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 900px){
    .brand small, #exportIcsBtn{ display:none; }
    .main, .main.with-detail{ grid-template-columns: minmax(0,1fr); }
    .main[data-m="cal"] .side{ display:none; }
    .main[data-m="wbs"] .cal{ display:none; }
    .main.with-detail .detail{ position:fixed; inset:0; z-index:60; border-left:none; }
    .mobile-nav{ display:flex; flex:none; height:52px; border-top:1px solid var(--border); background:var(--bg-sidebar); }
    .mobile-nav button{ flex:1; border:none; background:none; font-weight:700; font-size:.88rem; color:var(--text-muted); cursor:pointer; }
    .mobile-nav button.active{ color:var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
    .cal-head h2{ font-size:1.05rem; }
    .ev .n{ display:none; }
    .d-body{ padding-left:16px; padding-right:16px; }
    .tl-lab{ width:170px; } .tl-bg{ left:170px; }
  }
</style>
</head>
<body>

<div class="setup-banner" id="setupBanner">⚠ Firebase 연결이 안 됐어요 — 지금 입력하는 내용은 이 화면에서만 보이고 저장되지 않아요.</div>

<div class="page">
  <header class="topbar">
    <div class="brand">메모 · 할일 <small>WBS × 캘린더</small></div>
    <div class="grow"></div>
    <button class="ghost-btn gbtn-top" id="gcalBtn" title="구글 캘린더 연동 (개인 일정을 초록색으로 표시)"><span class="gd"></span><span id="gcalBtnText">구글 캘린더</span></button>
    <button class="ghost-btn" id="exportIcsBtn" title="날짜가 있는 작업을 .ics 파일로 내려받아 구글 캘린더 '설정 > 가져오기'로 한 번에 넣을 수 있어요">ICS 내보내기</button>
    <span class="sync-pill" id="syncPill"><span class="dot"></span><span id="syncText">연결 중…</span></span>
  </header>

  <div class="main" id="main" data-m="cal">
    <!-- ============ WBS ============ -->
    <aside class="side" id="side">
      <div class="side-head">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" type="text" placeholder="작업 · 메모 검색" autocomplete="off" />
        </div>
        <div class="side-actions">
          <button class="new-btn" id="newTaskBtn">+ 새 작업</button>
          <button class="new-btn alt" id="newNoteBtn">+ 새 메모</button>
        </div>
        <div class="side-opts">
          <label class="switch"><input type="checkbox" id="memoTreeChk"> 작업 아래 메모 표시</label>
          <span class="links"><button id="expandAllBtn">모두 펼치기</button><button id="collapseAllBtn">접기</button></span>
        </div>
      </div>
      <ul class="tree" id="tree"></ul>
    </aside>

    <!-- ============ 캘린더 ============ -->
    <section class="cal" id="cal">
      <div class="cal-head">
        <button class="today-btn" id="todayBtn">오늘</button>
        <button class="nav-btn" id="prevBtn" aria-label="이전">‹</button>
        <button class="nav-btn" id="nextBtn" aria-label="다음">›</button>
        <h2 id="calTitle"></h2>
        <div class="grow"></div>
        <div class="legend" title="캘린더 막대 앞 네모를 누르면 상태를 바꿀 수 있어요">
          <span>□ 할일</span><span class="l-pr"><b>◐</b>진행중</span><span class="l-ok"><b>✓</b>완료</span><span><b>→</b>미룸</span><span class="l-q"><b>?</b>확인</span><span class="l-pe"><b>●</b>개인</span>
        </div>
        <label class="switch" title="완료(✓)된 작업을 캘린더에서 숨깁니다"><input type="checkbox" id="hideDoneChk"> 완료 숨김</label>
        <label class="switch" title="작업/메모 제목 아래 내용(설명)을 캘린더에 펼쳐 보고 줄마다 체크합니다"><input type="checkbox" id="bodyChk"> 내용</label>

        <label class="switch"><input type="checkbox" id="memoCalChk"> 메모</label>

<script>
(function(){
  'use strict';

  /* =========================================================
     상수 & 유틸
     ========================================================= */
  var MARKERS = [
    { key:'dot', glyph:'•', label:'메모' },
    { key:'number', glyph:'#', label:'번호' },
    { key:'question', glyph:'?', label:'확인 필요' },
    { key:'arrow-left', glyph:'←', label:'앞으로 당김' },
    { key:'arrow-right', glyph:'→', label:'다음으로 미룸' },
    { key:'progress', glyph:'◐', label:'진행중' },
    { key:'check', glyph:'✓', label:'완료' }
  ];
  function markerMeta(key){ return MARKERS.find(function(m){ return m.key === key; }) || MARKERS[0]; }

  // 구글 캘린더 기본 색상
  var PALETTE = [
    ['#039be5','공작'], ['#33b679','세이지'], ['#f4511e','귤'], ['#8e24aa','포도'], ['#d50000','토마토'],
    ['#0b8043','바질'], ['#3f51b5','블루베리'], ['#f6bf26','바나나'], ['#e67c73','플라밍고'], ['#7986cb','라벤더'], ['#616161','흑연']
  ];
  var WD = ['일','월','화','수','목','금','토'];

  function uid(){ return Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function parseYmd(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(s, n){ var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function addMonths(s, n){ var d = parseYmd(s); return ymd(new Date(d.getFullYear(), d.getMonth() + n, 1)); }
  function diffDays(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); } // b - a
  function todayStr(){ return ymd(new Date()); }
  function fmtMD(s){ var d = parseYmd(s); return (d.getMonth()+1) + '/' + d.getDate(); }
  function fmtLong(s){ var d = parseYmd(s); return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')'; }
  function fmtRange(r){ return r.s === r.e ? fmtMD(r.s) : fmtMD(r.s) + '–' + fmtMD(r.e); }
  function fmtStamp(ts){
    var d = new Date(ts), now = new Date();
    var timeStr = d.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    if(d.toDateString() === now.toDateString()) return '오늘 ' + timeStr;
    var opts = d.getFullYear() === now.getFullYear() ? {month:'short', day:'numeric'} : {year:'numeric', month:'short', day:'numeric'};
    return d.toLocaleDateString('ko-KR', opts) + ' ' + timeStr;
  }
  function firstLine(text, len){
    var line = (text || '').split('\n').find(function(l){ return l.trim().length; }) || '';
    line = line.trim();
    return line.length > len ? line.slice(0, len) + '…' : line;
  }
  function textOn(hex){
    if(!hex || hex[0] !== '#') return '#fff';
    var r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
    return (0.299*r + 0.587*g + 0.114*b) > 170 ? '#2c2410' : '#fff';
  }
  function lsGet(k, def){ try{ var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function isMobile(){ return window.matchMedia('(max-width: 900px)').matches; }

  // 작은 DOM 헬퍼
  function h(tag, props, kids){
    var el = document.createElement(tag);
    if(props) for(var k in props){
      var v = props[k];
      if(v == null || v === false) continue;
      if(k === 'class') el.className = v;
      else if(k === 'style') el.style.cssText = v;
      else if(k === 'text') el.textContent = v;
      else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
      else if(k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    (function add(list){
      (Array.isArray(list) ? list : [list]).forEach(function(c){
        if(c == null || c === false) return;
        if(Array.isArray(c)) add(c);
        else el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      });
    })(kids || []);
    return el;
  }
  var toastEl = document.getElementById('toast');
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastEl._t); toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function flashSaved(dot){
    if(!dot) return;
    dot.classList.add('show'); clearTimeout(dot._t);
    dot._t = setTimeout(function(){ dot.classList.remove('show'); }, 900);
  }

  /* =========================================================
     상태
     ========================================================= */
  var tasks = [], notes = [];
  var TREE = { rows:[], num:{}, byId:{}, kids:{}, idx:{} };
  var sel = null;                      // {type:'task'|'note'|'day', id}
  var collapsed = lsGet('mj.collapsed', {});
  var ui = Object.assign({ view:'month', memoTree:true, memoCal:true, unassignedOpen:true, showBody:true, showPersonal:true }, lsGet('mj.ui', {}));
  var cursor = todayStr();
  var db = null, tasksCol = null, notesCol = null, filesCol = null, chunksCol = null;
  var files = [];                      // 첨부 메타데이터
  var fileCache = {}, uploading = {};
  var CHUNK = 900000, MAX_FILE = 10 * 1024 * 1024;
  var dragInfo = null;
  var pending = null;                  // 디바운스 저장
  var refs = {};                       // 상세 패널 요소 참조
  var tlScroll = {};                   // 타임라인 스크롤 보존

  function saveUi(){ lsSet('mj.ui', ui); }
  function saveCollapsed(){ lsSet('mj.collapsed', collapsed); }

  var mainEl = document.getElementById('main');
  var treeEl = document.getElementById('tree');
  var calBody = document.getElementById('calBody');
  var calTitle = document.getElementById('calTitle');
  var detailEl = document.getElementById('detail');
  var searchInput = document.getElementById('searchInput');
  var syncPill = document.getElementById('syncPill');
  var syncText = document.getElementById('syncText');
  function setSync(state, text){ syncPill.className = 'sync-pill ' + state; syncText.textContent = text; }

  /* =========================================================
     데이터 헬퍼
     ========================================================= */
  function getTask(id){ return TREE.byId[id] || tasks.find(function(t){ return t.id === id; }) || null; }
  function getNote(id){ return notes.find(function(n){ return n.id === id; }) || null; }
  function children(id){ return TREE.kids[id || 'root'] || []; }
  function parentKey(t){ return (t.parentId && TREE.byId[t.parentId]) ? t.parentId : 'root'; }
  function ancestors(t){
    var chain = [], cur = t, guard = 0;
    while(cur && cur.parentId && TREE.byId[cur.parentId] && guard++ < 200){ cur = TREE.byId[cur.parentId]; chain.unshift(cur); }
    return chain;
  }
  function descendantIds(id){
    var out = [];
    children(id).forEach(function(c){ out.push(c.id); out = out.concat(descendantIds(c.id)); });
    return out;
  }
  function ownRange(t){
    var e = t.date || '', s = t.startDate || '';
    if(!e && !s) return null;
    if(!e) e = s; if(!s) s = e;
    if(s > e){ var x = s; s = e; e = x; }
    return { s:s, e:e };
  }
  function rollRange(t){
    var r = ownRange(t);
    children(t.id).forEach(function(k){
      var kr = rollRange(k);
      if(!kr) return;
      if(!r) r = { s:kr.s, e:kr.e };
      else { if(kr.s < r.s) r.s = kr.s; if(kr.e > r.e) r.e = kr.e; }
    });
    return r;
  }
  function progress(t){
    var ids = descendantIds(t.id);
    var leaves = ids.filter(function(id){ return children(id).length === 0; });
    if(!leaves.length) return null;
    var done = leaves.filter(function(id){ var x = TREE.byId[id]; return x && x.marker === 'check'; }).length;
    return { done:done, total:leaves.length };
  }
  var PERSONAL = '#0b8043';   // 개인 일정 = 초록(바질)
  function isPersonal(t){
    var cur = t, guard = 0;
    while(cur && guard++ < 200){ if(cur.personal) return true; cur = cur.parentId ? TREE.byId[cur.parentId] : null; }
    return false;
  }
  function taskColor(t){
    var cur = t, guard = 0;
    while(cur && guard++ < 200){
      if(cur.personal) return G.persColor || PERSONAL;
      if(cur.color) return cur.color;
      if(!cur.parentId || !TREE.byId[cur.parentId]) break;
      cur = TREE.byId[cur.parentId];
    }
    var id = cur ? cur.id : '', hsh = 0;
    for(var i = 0; i < id.length; i++) hsh = (hsh * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[hsh % 10][0];
  }
  function noteTask(n){ return n.taskId && TREE.byId[n.taskId] ? n.taskId : null; }
  function noteDate(n){
    if(n.date) return n.date;
    var ts = n.createdAt || n.updatedAt;
    return ts ? ymd(new Date(ts)) : '';
  }
  function noteTitle(n){ return (n.title && n.title.trim()) || firstLine(n.body, 40) || '새 메모'; }
  function notesOf(taskId){
    return notes.filter(function(n){ return n.taskId === taskId; })
      .sort(function(a,b){ var da = noteDate(a), dbb = noteDate(b); return da < dbb ? 1 : da > dbb ? -1 : (b.updatedAt||0) - (a.updatedAt||0); });
  }
  function taskMatch(t, q){ return (t.title||'').toLowerCase().indexOf(q) > -1 || (t.notes||'').toLowerCase().indexOf(q) > -1; }
  function noteMatch(n, q){ return (n.title||'').toLowerCase().indexOf(q) > -1 || (n.body||'').toLowerCase().indexOf(q) > -1; }
  function query(){ return (searchInput.value || '').trim().toLowerCase(); }

  function sortSibs(list, isRoot, startOf){
    list.sort(function(a, b){
      var ao = typeof a.order === 'number', bo = typeof b.order === 'number';
      if(ao && bo && a.order !== b.order) return a.order - b.order;
      if(ao !== bo) return ao ? -1 : 1;
      if(isRoot){
        var ad = startOf(a) || '9999-99-99', bd = startOf(b) || '9999-99-99';
        if(ad !== bd) return ad < bd ? -1 : 1;
      }
      return (a.createdAt||0) - (b.createdAt||0);
    });
  }

  // WBS 트리 재계산 (번호 1, 1.1, 1.1.1 …)
  function rebuild(){
    var byId = {};
    tasks.forEach(function(t){ byId[t.id] = t; });
    var kids = { root:[] };
    tasks.forEach(function(t){
      var p = (t.parentId && byId[t.parentId] && t.parentId !== t.id) ? t.parentId : 'root';
      (kids[p] = kids[p] || []).push(t);
    });
    var memo = {};
    function startOf(t, depth){
      if(memo[t.id] !== undefined) return memo[t.id];
      memo[t.id] = null;
      var r = ownRange(t), s = r ? r.s : null;
      if((depth || 0) < 50) (kids[t.id] || []).forEach(function(k){ var ks = startOf(k, (depth || 0) + 1); if(ks && (!s || ks < s)) s = ks; });
      return (memo[t.id] = s);
    }
    Object.keys(kids).forEach(function(k){ sortSibs(kids[k], k === 'root', startOf); });
    var rows = [], num = {}, idx = {}, rootIdx = {}, seen = {};
    function walk(key, prefix, level){
      (kids[key] || []).forEach(function(t, i){
        if(seen[t.id]) return; seen[t.id] = 1;
        var n = prefix ? prefix + '.' + (i+1) : String(i+1);
        num[t.id] = n; idx[t.id] = rows.length;
        if(level === 0) rootIdx[t.id] = i;
        rows.push({ task:t, num:n, level:level });
        walk(t.id, n, level + 1);
      });
    }
    walk('root', '', 0);
    // 순환 참조 등으로 누락된 작업은 최상위로 표시
    tasks.forEach(function(t){
      if(!seen[t.id]){ seen[t.id] = 1; var n = String((kids.root.length) + 1); num[t.id] = n; idx[t.id] = rows.length; rows.push({ task:t, num:n, level:0 }); }
    });
    TREE = { rows:rows, num:num, byId:byId, kids:kids, idx:idx, rootIdx:rootIdx };
  }

  /* =========================================================
     저장 (Firestore)
     ========================================================= */
  function clean(o){ var r = {}; for(var k in o){ if(o[k] !== undefined) r[k] = o[k]; } return r; }
  function taskDoc(t){
    return clean({
      parentId: t.parentId || null, title: t.title || '', notes: t.notes || '',
      date: t.date || '', startDate: t.startDate || '', marker: t.marker || 'dot', color: t.color || '',
      personal: t.personal ? true : undefined, gcalId: t.gcalId || undefined, gcalCal: t.gcalCal || undefined,
      order: typeof t.order === 'number' ? t.order : undefined,
      createdAt: t.createdAt || Date.now(), updatedAt: t.updatedAt || Date.now()
    });
  }
  function noteDoc(n){
    return clean({
      title: n.title || '', body: n.body || '', taskId: n.taskId || null, date: n.date || '',
      createdAt: n.createdAt || n.updatedAt || Date.now(), updatedAt: n.updatedAt || Date.now()
    });
  }
  function fail(){ setSync('off', '저장 실패 — 연결을 확인해주세요'); }
  function saveTask(t){
    if(!tasksCol) return;
    tasksCol.doc(t.id).set(taskDoc(t)).then(function(){ flashSaved(refs.dot); }).catch(fail);
  }
  function saveNote(n){
    if(!notesCol) return;
    notesCol.doc(n.id).set(noteDoc(n)).then(function(){ flashSaved(refs.dot); }).catch(fail);
  }
  function debounceSave(fn){
    if(pending) clearTimeout(pending.t);
    pending = { fn:fn, t:setTimeout(function(){ var p = pending; pending = null; if(p) p.fn(); }, 400) };
  }
  function flushPending(){
    if(!pending) return;
    clearTimeout(pending.t); var f = pending.fn; pending = null; f();
  }

  /* =========================================================
     생성 / 삭제 / 이동
     ========================================================= */
  function createTask(opts){
    opts = opts || {};
    closeQA();
    var parentId = opts.parentId && TREE.byId[opts.parentId] ? opts.parentId : null;
    var sibs = children(parentId || 'root');
    var t = { id:uid(), parentId:parentId, title:opts.title || '', notes:'', date:opts.date || '', startDate:'',
              marker:'dot', color:'', createdAt:Date.now(), updatedAt:Date.now() };
    if(sibs.some(function(s){ return typeof s.order === 'number'; })){
      t.order = sibs.reduce(function(m, s){ return Math.max(m, typeof s.order === 'number' ? s.order : -1); }, -1) + 1;
    }
    tasks.push(t);
    if(parentId && collapsed[parentId]){ delete collapsed[parentId]; saveCollapsed(); }
    saveTask(t);
    rebuild();
    if(opts.select !== false) selectTask(t.id, { focusTitle: !opts.title });
    else refresh();
    return t;
  }
  function createNote(opts){
    opts = opts || {};
    closeQA();
    var n = { id:uid(), title:opts.title || '', body:'', taskId:opts.taskId || null, date:opts.date || todayStr(),
              createdAt:Date.now(), updatedAt:Date.now() };
    notes.push(n);
    saveNote(n);
    selectNote(n.id, { focusTitle: !opts.title });
    return n;
  }
  function deleteTask(id){
    var remove = [id].concat(descendantIds(id));
    tasks = tasks.filter(function(t){ return remove.indexOf(t.id) === -1; });
    remove.forEach(function(rid){ if(tasksCol) tasksCol.doc(rid).delete().catch(function(){}); deleteFilesOf('task', rid); });
    notes.forEach(function(n){ if(n.taskId && remove.indexOf(n.taskId) > -1){ n.taskId = null; n.updatedAt = Date.now(); saveNote(n); } });
    sel = null; rebuild(); renderDetail(); refresh();
  }
  function deleteNote(id){
    var n = getNote(id); var back = n && noteTask(n);
    notes = notes.filter(function(x){ return x.id !== id; });
    if(notesCol) notesCol.doc(id).delete().catch(function(){});
    deleteFilesOf('note', id);
    if(back) selectTask(back); else { sel = null; renderDetail(); refresh(); }
  }
  function normalizeOrder(list){
    list.forEach(function(x, i){ if(x.order !== i){ x.order = i; x.updatedAt = Date.now(); saveTask(x); } });
  }
  function moveUpDown(t, dir){
    var sibs = children(parentKey(t)).slice();
    var i = sibs.indexOf(t), j = i + dir;
    if(i < 0 || j < 0 || j >= sibs.length) return;
    sibs[i] = sibs[j]; sibs[j] = t;
    normalizeOrder(sibs); rebuild(); refresh(); renderDetail();
  }
  function indentTask(t){
    var sibs = children(parentKey(t));
    var i = sibs.indexOf(t);
    if(i <= 0){ toast('바로 위에 같은 단계의 작업이 있어야 들여쓸 수 있어요'); return; }
    var np = sibs[i-1];
    t.parentId = np.id; t.updatedAt = Date.now();
    var kids = children(np.id).slice(); kids.push(t);
    normalizeOrder(kids); saveTask(t);
    delete collapsed[np.id]; saveCollapsed();
    rebuild(); refresh(); renderDetail();
  }
  function outdentTask(t){
    var p = t.parentId && TREE.byId[t.parentId];
    if(!p){ toast('이미 최상위 작업이에요'); return; }
    t.parentId = p.parentId && TREE.byId[p.parentId] ? p.parentId : null; t.updatedAt = Date.now();
    var sibs = children(parentKey(p)).slice();
    sibs.splice(sibs.indexOf(p) + 1, 0, t);
    normalizeOrder(sibs); saveTask(t);
    rebuild(); refresh(); renderDetail();
  }
  function setTaskRange(t, s, e){
    if(s && !e) e = s;
    if(!s && e) s = e;
    if(s && e && s > e){ var x = s; s = e; e = x; }
    t.startDate = (s && e && s !== e) ? s : '';
    t.date = e || '';
    t.updatedAt = Date.now();
    saveTask(t);
  }
  function moveTaskTo(t, grabDate, dropDate){
    var r = ownRange(t);
    if(!r){ setTaskRange(t, dropDate, dropDate); return; }
    var delta = diffDays(grabDate || r.s, dropDate);
    if(!delta) return;
    setTaskRange(t, addDays(r.s, delta), addDays(r.e, delta));
  }
  function dropOn(date){
    if(!dragInfo) return;
    var d = dragInfo; dragInfo = null;
    if(d.kind === 'task'){ var t = getTask(d.id); if(t) moveTaskTo(t, d.grab, date); }
    else if(d.kind === 'gev'){ var g = gFind(d.id); if(g) gMove(g, d.grab, date); return; }
    else { var n = getNote(d.id); if(n){ n.date = date; n.updatedAt = Date.now(); saveNote(n); } }
    rebuild(); refresh();
    if(sel && sel.id === d.id) renderDetail();
  }

  /* =========================================================
     선택
     ========================================================= */
  function expandTo(id){
    var t = getTask(id); if(!t) return;
    var changed = false;
    ancestors(t).forEach(function(a){ if(collapsed[a.id]){ delete collapsed[a.id]; changed = true; } });
    if(changed) saveCollapsed();
  }
  function selectTask(id, opts){
    flushPending(); closeQA(); closeMarkerMenu();
    sel = { type:'task', id:id };
    expandTo(id);
    renderDetail(); refresh();
    scrollTreeTo(id);
    if(opts && opts.focusTitle && refs.title) refs.title.focus();
  }
  function selectNote(id, opts){
    flushPending(); closeQA(); closeMarkerMenu();
    sel = { type:'note', id:id };
    var n = getNote(id); if(n && noteTask(n)) expandTo(n.taskId);
    renderDetail(); refresh();
    scrollTreeTo(id);
    if(opts && opts.focusTitle && refs.title) refs.title.focus();
  }
  function openDay(date){
    flushPending(); closeQA(); closeMarkerMenu();
    sel = { type:'day', id:date };
    renderDetail(); refresh();
  }
  function closeDetail(){ flushPending(); sel = null; renderDetail(); refresh(); }
  function scrollTreeTo(id){
    var el = treeEl.querySelector('[data-id="' + id + '"]');
    if(el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
  }

  function refresh(){ rebuild(); renderTree(); renderCal(); }

  /* =========================================================
     표시(marker) 메뉴
     ========================================================= */
  var openMenu = null;
  function closeMarkerMenu(){ if(openMenu){ openMenu.remove(); openMenu = null; } }
  function openMarkerMenu(anchor, current, onPick){
    closeMarkerMenu();
    var menu = h('div', { class:'marker-menu', onclick:function(e){ e.stopPropagation(); } },
      MARKERS.map(function(m){
        return h('button', { type:'button', title:m.label, class: m.key === current ? 'sel' : '',

  function renderTree(){
    var q = query();
    var vis = null, nvis = null;
    if(q){
      vis = {}; nvis = {};
      var markUp = function(id){ var cur = TREE.byId[id], g = 0; while(cur && g++ < 200){ vis[cur.id] = 1; cur = cur.parentId ? TREE.byId[cur.parentId] : null; } };
      notes.forEach(function(n){ if(noteMatch(n, q)){ nvis[n.id] = 1; var tid = noteTask(n); if(tid) markUp(tid); } });
      tasks.forEach(function(t){ if(taskMatch(t, q)) markUp(t.id); });
    }
    var frag = document.createDocumentFragment();
    var skip = null, shown = 0;
    TREE.rows.forEach(function(row){
      var t = row.task;
      if(q){ if(!vis[t.id]) return; }
      else {
        if(skip !== null && row.level > skip) return;
        skip = null;
        if(collapsed[t.id]) skip = row.level;
      }
      shown++;
      frag.appendChild(taskRow(row));
      var showMemos = q ? true : (ui.memoTree && !collapsed[t.id]);
      if(showMemos){
        notesOf(t.id).forEach(function(n){ if(q && !nvis[n.id]) return; frag.appendChild(noteRow(n, row.level + 1)); });
      }
    });
    if(!shown){
      frag.appendChild(h('li', { class:'empty-list', text: q ? '검색 결과에 맞는 작업이 없어요.' : '작업이 없어요. ‘+ 새 작업’이나 캘린더 날짜를 눌러 시작해보세요.' }));
    }
    var un = notes.filter(function(n){ return !noteTask(n); })
      .sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });

    if(open){
      if(!un.length) frag.appendChild(h('li', { class:'muted', style:'padding:2px 12px 8px', text:'작업에 속하지 않은 메모가 여기에 모여요.' }));
      un.forEach(function(n){ frag.appendChild(noteRow(n, 0)); });
    }

  var TOP = 30, LH = 21;

  function renderCal(){

  function renderWeeks(weekStarts, curMonth){
    var today = todayStr();

    var month = h('div', { class:'month' });

        (function(c){
          var ds = addDays(ws, c), dd = parseYmd(ds);
          var cls = 'cell' + (c === 0 ? ' sun wkend' : c === 6 ? ' sat wkend' : '') + (ds === today ? ' today' : '') +
            (curMonth !== null && dd.getMonth() !== curMonth ? ' other' : '') + (sel && sel.type === 'day' && sel.id === ds ? ' dsel' : '');

        })(c);
      }
      wk.appendChild(cells);
      // 드래그 앤 드롭 (막대 위에서도 동작하도록 주 단위로 처리)
      var colAt = function(e){ var r = wk.getBoundingClientRect(); return Math.max(0, Math.min(6, Math.floor((e.clientX - r.left) / (r.width / 7)))); };
      wk.addEventListener('dragover', function(e){
        if(!dragInfo) return; e.preventDefault();
        var c = colAt(e); clearDropMarks(); cells.children[c].classList.add('drop');
      });
      wk.addEventListener('dragleave', function(e){ if(!wk.contains(e.relatedTarget)) clearDropMarks(); });
      wk.addEventListener('drop', function(e){ e.preventDefault(); clearDropMarks(); dropOn(addDays(ws, colAt(e))); });
      weeksEl.appendChild(wk);
      weekEls.push({ el:wk, ws:ws });
    });

    calBody.appendChild(month);
    var hgt = weekEls.length ? weekEls[0].el.clientHeight : 0;
    if(ui.showBody){
      var maxL = curMonth === null ? 40 : 4;
      weekEls.forEach(function(w){ layoutWeekXp(w.el, w.ws, items, maxL, hgt); });
      weeksEl.classList.add('xp');
      return;
    }
    var cap = curMonth === null ? 999 : Math.max(1, Math.floor((hgt - TOP - 2) / LH));
    weekEls.forEach(function(w){ layoutWeek(w.el, w.ws, items, cap); });
  }

  function layoutWeek(wk, ws, items, cap){
    var we = addDays(ws, 6);
    var list = items.filter(function(it){ return it.s <= we && it.e >= ws; }).map(function(it){
      return { it:it, c0:Math.max(0, diffDays(ws, it.s)), c1:Math.min(6, diffDays(ws, it.e)) };
    });
    list.sort(function(a, b){
      return (a.c0 - b.c0) || ((b.c1 - b.c0) - (a.c1 - a.c0)) ||
        (a.it.kind === b.it.kind ? 0 : (a.it.kind === 'task' ? -1 : 1)) || (a.it.ord - b.it.ord);
    });
    var lanes = [];
    list.forEach(function(x){
      for(var L = 0; ; L++){
        var row = lanes[L] || (lanes[L] = []);
        var free = true;
        for(var c = x.c0; c <= x.c1; c++) if(row[c]){ free = false; break; }
        if(free){ for(c = x.c0; c <= x.c1; c++) row[c] = 1; x.L = L; break; }
      }
    });
    var overflow = [0,0,0,0,0,0,0], hidden = [0,0,0,0,0,0,0];
    list.forEach(function(x){ if(x.L >= cap) for(var c = x.c0; c <= x.c1; c++) overflow[c] = 1; });
    list.forEach(function(x){
      var ok = x.L < cap - 1;
      if(!ok && x.L === cap - 1){ ok = true; for(var c = x.c0; c <= x.c1; c++) if(overflow[c]) ok = false; }
      if(!ok){ for(var c2 = x.c0; c2 <= x.c1; c2++) hidden[c2]++; return; }
      wk.appendChild(evEl(x, ws, we, wk));
    });
    hidden.forEach(function(n, c){
      if(!n) return;
      var ds = addDays(ws, c);
      wk.appendChild(h('div', { class:'more', text:'+' + n + '개 더보기',
        style:'left:calc(' + (c*100/7) + '% + 2px); width:calc(' + (100/7) + '% - 4px); top:' + (TOP + (cap-1)*LH) + 'px',
        onclick:function(e){ e.stopPropagation(); openDay(ds); } }));
    });
  }

  /* =========================================================

  var GSCOPE = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly';

  function gCalColor(calId){ return G.calColors[calId] || (calId === 'primary' ? G.calColors[(G.list.find(function(c){ return c.primary; }) || {}).id] : '') || G.persColor; }
  function gColor(g){ return (g.colorId && GCOLORS[g.colorId]) || gCalColor(g.calId); }
  var marksCol = null, settingsDoc = null, gModal = null, gSyncT = null;
  function enc(x){ return encodeURIComponent(x); }
  function gReady(){ return !!(G.token && G.token.v && G.token.exp > Date.now() + 30000); }

  function gCalName(id){ var c = G.list.find(function(x){ return x.id === id || (id === 'primary' && x.primary); }); return c ? (c.summaryOverride || c.summary) : '구글 캘린더'; }

  function gOnDay(d){ return gVisible().filter(function(g){ return g.s <= d && g.e >= d; }); }
  function htmlToText(s){
    if(!s || s.indexOf('<') === -1) return s || '';
    var x = s.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h\d)>/gi, '\n').replace(/<li[^>]*>/gi, '- ');
    var doc = new DOMParser().parseFromString(x, 'text/html');

  }
  function gMap(ev, calId){

    var allDay = !!ev.start.date, s, e, time = '', endTime = '', sdt = '', edt = '';
    if(allDay){ s = ev.start.date; e = addDays((ev.end && ev.end.date) || ev.start.date, -1); if(e < s) e = s; }
    else {
      var sd = new Date(ev.start.dateTime), ed = new Date((ev.end && ev.end.dateTime) || ev.start.dateTime);

             colorId:ev.colorId || '', desc:htmlToText(ev.description || ''), location:ev.location || '', link:ev.htmlLink || '', recurring:!!ev.recurringEventId, updated:ev.updated || '' };
  }
  function gUpdateBtn(){
    var b = document.getElementById('gcalBtn'), tx = document.getElementById('gcalBtnText'); if(!b) return;

  function gLoadLib(){
    return new Promise(function(res, rej){

      var sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onload = function(){ gMakeClient(); res(); }; sc.onerror = rej;

  }
  function gMakeClient(){

      client_id:G.clientId, scope:GSCOPE,
      callback:function(r){
        if(!r || r.error){ toast('구글 연결 실패: ' + ((r && (r.error_description || r.error)) || '알 수 없음')); return; }
        G.token = { v:r.access_token, exp:Date.now() + (+r.expires_in || 3600) * 1000 };
        lsSet('mj.gtok', G.token); lsSet('mj.gwas', 1);

      },
      error_callback:function(e){ toast('구글 연결이 취소됐어요' + (e && e.type === 'popup_failed_to_open' ? ' — 팝업 차단을 풀어주세요' : '')); }
    });

  }
  function gConnect(){
    if(!G.clientId){ openGSettings(); return; }
    if(location.protocol === 'file:') toast('파일로 연 상태에서는 구글 로그인이 안 될 수 있어요 — GitHub Pages 주소로 열어주세요');
    if(G.tc){ G.tc.requestAccessToken({ prompt: lsGet('mj.gwas', 0) ? '' : 'consent' }); return; }
    gLoadLib().then(function(){ toast('준비됐어요 — 한 번 더 눌러주세요'); }).catch(function(){ toast('구글 로그인 모듈을 불러오지 못했어요'); });

  function gDisconnect(){

  async function gFetch(path, opts){

  function bodyLines(text){
    var out = [];

      var lvl = Math.floor(info.indent.replace(/\t/g, '    ').length / 4);
      var txt = (info.type === 'chk' || info.type === 'bul') ? line.slice(info.plen) : line.slice(info.indent.length);

    });

  }
  function noteLines(n){

  function toggleLineIn(text, idx){

    else if(info.type === 'bul') lines[idx] = info.indent + '☑ ' + line.slice(info.plen);

  }

    var lines = (obj[field] || '').split('\n'), line = lines[idx];

  /* =========================================================
     첨부 (사진 · 파일) — Firestore에 조각(chunk)으로 저장
       files      : { ownerType:'task'|'note', ownerId, name, type, size, chunks, thumb, createdAt }
       fileChunks : { fileId, i, data }   (문서 1개 ≈ 0.9MB)
     ========================================================= */
  function filesOf(kind, id){
    return files.filter(function(f){ return f.ownerType === kind && f.ownerId === id; })
      .sort(function(a, b){ return (a.createdAt || 0) - (b.createdAt || 0); });
  }
  function fmtSize(n){ return n < 1024 ? n + 'B' : n < 1048576 ? Math.round(n / 1024) + 'KB' : (n / 1048576).toFixed(1) + 'MB'; }
  function fileIcon(f){
    var t = f.type || '', n = (f.name || '').toLowerCase();
    if(/pdf/.test(t) || /\.pdf$/.test(n)) return '📕';
    if(/sheet|excel|csv/.test(t) || /\.(xlsx?|csv)$/.test(n)) return '📗';
    if(/word|document|hwp/.test(t) || /\.(docx?|hwpx?|txt|rtf)$/.test(n)) return '📘';
    if(/presentation|powerpoint/.test(t) || /\.pptx?$/.test(n)) return '📙';
    if(/zip|compressed|rar|7z/.test(t) || /\.(zip|7z|rar)$/.test(n)) return '🗜️';
    if(t.indexOf('audio/') === 0) return '🎵';
    if(t.indexOf('video/') === 0) return '🎬';
    if(t.indexOf('image/') === 0) return '🖼️';
    return '📄';
  }
  function readAsDataURL(blob){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = rej; r.readAsDataURL(blob); }); }
  function loadImg(src){ return new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = src; }); }
  function scaleTo(img, max, q){
    var w = img.naturalWidth, hh = img.naturalHeight, k = Math.min(1, max / Math.max(w, hh));
    var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(hh * k));
    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  }
  function b64Size(du){ var i = du.indexOf(','); return Math.floor((du.length - i - 1) * 3 / 4); }
  function dataURLtoBlob(du){
    var i = du.indexOf(','), mime = (du.slice(5, i).split(';')[0]) || 'application/octet-stream';
    var bin = atob(du.slice(i + 1)), arr = new Uint8Array(bin.length);
    for(var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new Blob([arr], { type:mime });
  }
  function hasFiles(e){ return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') > -1; }
  function fileDropTarget(el, hl, kind, id){
    el.addEventListener('dragover', function(e){ if(!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); hl.classList.add('over'); });
    el.addEventListener('dragleave', function(e){ if(!el.contains(e.relatedTarget)) hl.classList.remove('over'); });
    el.addEventListener('drop', function(e){ if(!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); hl.classList.remove('over'); addFiles(kind, id, e.dataTransfer.files); });
  }
  function pasteFiles(kind, id){
    return function(e){
      var fl = e.clipboardData && e.clipboardData.files;
      if(fl && fl.length){ e.preventDefault(); addFiles(kind, id, fl); }
    };
  }
  function afterFilesChange(){ if(refs.attFill) refs.attFill(); renderCal(); }

  async function addFiles(kind, ownerId, list){
    list = Array.prototype.slice.call(list || []);
    if(!list.length) return;
    if(!filesCol) toast('오프라인 상태라 첨부가 이 화면에만 임시로 보여요');
    for(var j = 0; j < list.length; j++){
      var file = list[j], fid = uid();
      var type = file.type || 'application/octet-stream';
      var name = file.name && file.name !== 'image.png' ? file.name : ('붙여넣은 이미지 ' + ymd(new Date()) + '.png');
      var isImg = type.indexOf('image/') === 0;
      if(!isImg && file.size > MAX_FILE){ toast('10MB가 넘는 파일은 올릴 수 없어요 · ' + name); continue; }
      uploading[fid] = { ownerType:kind, ownerId:ownerId, name:name };
      afterFilesChange();
      try{
        var raw = await readAsDataURL(file), data = raw, thumb = '';
        if(/^image\/(jpeg|jpg|png|webp|bmp|heic|heif)$/.test(type)){
          try{
            var img = await loadImg(raw);
            var jpg = scaleTo(img, 2000, 0.85);
            if(jpg.length < raw.length || file.size > MAX_FILE){ data = jpg; type = 'image/jpeg'; if(!/\.jpe?g$/i.test(name)) name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
            thumb = scaleTo(img, 240, 0.7);
          }catch(_){ /* 브라우저가 못 여는 형식(HEIC 등)은 원본 그대로 */ }
        } else if(isImg && raw.length < 200000){ thumb = raw; }
        if(b64Size(data) > MAX_FILE){ toast('10MB가 넘는 파일은 올릴 수 없어요 · ' + name); delete uploading[fid]; afterFilesChange(); continue; }
        var n = Math.max(1, Math.ceil(data.length / CHUNK));
        var meta = { ownerType:kind, ownerId:ownerId, name:name, type:type, size:b64Size(data), chunks:n, thumb:thumb, createdAt:Date.now() };
        if(filesCol){
          for(var i = 0; i < n; i++){
            if(n > 1) setSync('', '업로드 중… ' + name + ' (' + (i + 1) + '/' + n + ')');
            await chunksCol.doc(fid + '_' + i).set({ fileId:fid, i:i, data:data.slice(i * CHUNK, (i + 1) * CHUNK) });
          }
          await filesCol.doc(fid).set(meta);
          setSync('on', '동기화됨');
        }
        fileCache[fid] = data;
        if(!files.some(function(f){ return f.id === fid; })) files.push(Object.assign({ id:fid }, meta));
        toast('첨부했어요 · ' + name);
      }catch(e){ toast('업로드 실패 · ' + name); setSync('off', '업로드 실패 — 연결을 확인해주세요'); }
      delete uploading[fid];
      afterFilesChange();
    }
  }
  async function getFileData(f){
    if(fileCache[f.id]) return fileCache[f.id];
    if(!chunksCol) throw new Error('offline');
    var parts = [];
    for(var i = 0; i < (f.chunks || 1); i++) parts.push(chunksCol.doc(f.id + '_' + i).get());
    var docs = await Promise.all(parts);
    var data = docs.map(function(d){ return d.exists ? d.data().data : ''; }).join('');
    fileCache[f.id] = data;
    return data;
  }
  function deleteFile(f){
    files = files.filter(function(x){ return x.id !== f.id; });
    delete fileCache[f.id];
    if(filesCol){
      filesCol.doc(f.id).delete().catch(function(){});
      for(var i = 0; i < (f.chunks || 1); i++) chunksCol.doc(f.id + '_' + i).delete().catch(function(){});
    }
    afterFilesChange();
  }
  function deleteFilesOf(kind, id){ filesOf(kind, id).forEach(deleteFile); }

  function attSection(kind, ownerId, dropEl){

  // 내용 펼침 배치: 줄 수에 따라 높이가 달라지는 카드형
  function layoutWeekXp(wk, ws, items, maxL, minH){
    var we = addDays(ws, 6);
    var list = items.filter(function(it){ return it.s <= we && it.e >= ws; }).map(function(it){
      return { it:it, c0:Math.max(0, diffDays(ws, it.s)), c1:Math.min(6, diffDays(ws, it.e)) };
    });
    list.sort(function(a, b){
      return (a.c0 - b.c0) || ((b.c1 - b.c0) - (a.c1 - a.c0)) ||
        (a.it.kind === b.it.kind ? 0 : (a.it.kind === 'task' ? -1 : 1)) || (a.it.ord - b.it.ord);
    });
    var lanes = [];
    list.forEach(function(x){
      for(var L = 0; ; L++){
        var row = lanes[L] || (lanes[L] = []);
        var free = true;
        for(var c = x.c0; c <= x.c1; c++) if(row[c]){ free = false; break; }
        if(free){ for(c = x.c0; c <= x.c1; c++) row[c] = 1; x.L = L; break; }
      }
      var n = Math.min(x.it.lines.length, maxL) + (x.it.lines.length > maxL ? 1 : 0);
      x.hh = 21 + (n ? n * 17 + 5 : 0);
    });
    var laneH = [];
    list.forEach(function(x){ laneH[x.L] = Math.max(laneH[x.L] || 0, x.hh); });
    var tops = [], y = TOP;
    for(var L = 0; L < laneH.length; L++){ tops[L] = y; y += (laneH[L] || 0) + 3; }
    list.forEach(function(x){ wk.appendChild(evEl(x, ws, we, wk, { top:tops[x.L], hh:x.hh, maxL:maxL })); });
    wk.style.height = Math.max(minH, y + 8) + 'px';
  }
